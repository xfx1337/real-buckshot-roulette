    </div>

    <!-- TV mode: no fullscreen gate, no wake lock -->

    <!-- Маршрутизация звука видео на выбранное оператором устройство (ТВ). -->
    <script src="/static/audio_output.js?v=1"></script>

    <script>
    // ── TV Video WebSocket ──
    // Separate connection for video overlay commands from dealer.
    const videoOverlay = document.getElementById('tv-video-overlay');
    const videoEl = document.getElementById('tv-video');
    const tvIndicator = document.getElementById('tv-ws-indicator');

    // На этом экране звучат оба канала вывода, каждый на своём устройстве:
    //   'video' — видеоролики (динамики ноутбука);
    //   'game'  — звуковые эффекты, включая шум CCTV-перехода (наушники).
    // Живые CCTV-потоки — iframe MediaMTX, их вывод браузер маршрутизировать
    // не даёт, поэтому они ни в одном канале не участвуют.
    // *SinkReady резолвится, когда выбранный выход применён к элементу. Медиа,
    // запущенное раньше, ушло бы на устройство по умолчанию.
    let videoSinkReady = Promise.resolve();
    let cctvSinkReady = Promise.resolve();
    const transitionEl = document.getElementById('tv-cctv-transition');
    if (window.AudioOutput) {
        videoSinkReady = window.AudioOutput.register(videoEl, 'video');
        if (transitionEl) cctvSinkReady = window.AudioOutput.register(transitionEl, 'game');
    }
    // Запуск видео строго после применения sink.
    function playVideoOnSelectedSink(onError) {
        const go = () => videoEl.play().catch(onError || (() => {}));
        videoSinkReady.then(go, go);
    }
    let tvWs;
    let tvReconnectTimer;
    let tvMutesGameSound = false;

    function connectTV() {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        tvWs = new WebSocket(`${proto}://${location.host}/ws/tv`);

        tvWs.onopen = () => {
            tvIndicator.classList.add('connected');
            clearTimeout(tvReconnectTimer);
            tvWs.pingInterval = setInterval(() => {
                if (tvWs.readyState === WebSocket.OPEN) tvWs.send(JSON.stringify({ping: 1}));
            }, 10000);
        };

        tvWs.onmessage = (e) => {
            try {
                const cmd = JSON.parse(e.data);
                handleVideoCommand(cmd);
            } catch (err) {
                console.warn('TV WS parse error', err);
            }
        };

        tvWs.onclose = () => {
            tvIndicator.classList.remove('connected');
            clearInterval(tvWs.pingInterval);
            tvReconnectTimer = setTimeout(connectTV, 2000);
        };
    }

    // Проверочный звук канала: берём готовый звук озвучки (preview=1 играет даже
    // если событие выключено) и гоним его через тот же sink, что и медиа этого
    // канала, — оператор слышит, куда реально уходит звук с этого экрана.
    function playChannelTest(channel) {
        const ch = channel === 'game' ? 'game' : 'video';
        try {
            const a = new Audio('/api/audio/file/ui_click?preview=1&t=' + Date.now());
            a.volume = 1.0;
            const start = () => a.play().catch(err => console.warn('audio test play error', err));
            // Ждём применения sink: play() до него уходит на устройство по умолчанию.
            if (window.AudioOutput) window.AudioOutput.register(a, ch).then(start, start);
            else start();
        } catch (e) { console.warn('audio test failed', e); }
    }

    function handleVideoCommand(cmd) {
        switch (cmd.action) {
            case 'play':
                if (cmd.video) {
                    const cacheBuster = cmd.mtime ? '?t=' + cmd.mtime : '';
                    const newSrc = '/videos/' + cmd.video + cacheBuster;
                    
                    if (videoEl.dataset.currentSrc === newSrc && videoOverlay.classList.contains('active')) {
                        videoEl.loop = !!cmd.loop;
                        tvMutesGameSound = !!cmd.mute_game_sound;
                        if (cmd.volume !== undefined) {
                            videoEl.volume = Math.max(0, Math.min(100, cmd.volume)) / 100.0;
                        }
                        if (videoEl.paused) playVideoOnSelectedSink(err => console.warn('Video play error', err));
                        break;
                    }

                    videoEl.dataset.currentSrc = newSrc;
                    videoEl.src = newSrc;
                    videoEl.loop = !!cmd.loop;
                    tvMutesGameSound = !!cmd.mute_game_sound;
                    if (cmd.volume !== undefined) {
                        videoEl.volume = Math.max(0, Math.min(100, cmd.volume)) / 100.0;
                    }
                    videoOverlay.classList.add('active');
                    playVideoOnSelectedSink(err => console.warn('Video play error', err));
                }
                break;
            case 'pause':
                videoEl.pause();
                break;
            case 'resume':
                playVideoOnSelectedSink();
                break;
            case 'stop':
                // Оверлей снимаем до pause(): обработчик 'pause' держит звук
                // выключенным, пока ролик на экране, и иначе не разглушит.
                videoOverlay.classList.remove('active');
                videoEl.pause();
                videoEl.removeAttribute('src');
                videoEl.load();
                tvMutesGameSound = false;
                if (window.SoundEngine) window.SoundEngine.setMuted(false);
                break;
            case 'set_volume':
                if (cmd.volume !== undefined) {
                    videoEl.volume = Math.max(0, Math.min(100, cmd.volume)) / 100.0;
                }
                break;
            case 'audio_output':
                // Оператор сменил устройство одного из каналов. Старые сообщения
                // канал не указывали — считаем их за 'video'.
                if (window.AudioOutput) {
                    window.AudioOutput.setSink(cmd.channel || 'video', cmd.device_id || '');
                }
                break;
            case 'audio_test':
                // Оператор проверяет, на какое устройство уходит канал с этого
                // экрана: 'video' — динамики, 'game' — наушники.
                playChannelTest(cmd.channel || 'video');
                break;
            case 'cctv':
                // Manual toggle from the dealer button — force CCTV on/off now.
                cctvManualToggle(cmd.active);
                break;
            case 'cctv_show':
                // Dealer picked specific cameras to push to the player right now.
                cctvShowSpecific(cmd.cameras || []);
                break;
            case 'cctv_config':
                // New auto-cycle / camera / fake-error settings pushed from dealer.
                cctvSetConfig(cmd.cctv || {});
                break;
            case 'message':
                // Текст с пульта оператора. instant — телевизор переподключился
                // к уже висящему сообщению, дорисовываем его целиком без печати.
                tvShowMessage(cmd);
                break;
            case 'message_clear':
                tvHideMessage();
                break;
            case 'rotary_guide':
                // Игрок применил карточку телефона: показываем, как набрать
                // выданный ему номер на дисковом аппарате.
                rgShow(cmd);
                break;
            case 'rotary_guide_clear':
                rgHide();
                break;
            case 'mp_slots':
                // Дилер задал число секций игроков на экране мультиплеера.
                mpSetSlots(cmd.slots);
                break;
        }
    }

    // ── Сообщение оператора: печать посимвольно ──
    // Оператор набирает текст на пульте, телевизор «печатает» его как терминал.
    // Печать идёт по таймеру на символ; служебные символы (пробел, перевод
    // строки) не щёлкают — так звук ближе к настоящей машинке.
    const msgOverlay = document.getElementById('tv-message');
    const msgBody = document.getElementById('tv-message-body');
    let msgTypeTimer = null;
    let msgHoldTimer = null;
    let msgClickCtx = null;

    // Щелчок клавиши синтезируем на месте: короткий шумовой импульс. Отдельный
    // звуковой файл под это не нужен, а на слабом телевизоре WebAudio-импульс
    // дешевле, чем создание нового Audio на каждый символ.
    function msgClick() {
        if (!msgTypeSound || !cctvAudioUnlocked) return;
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            if (!msgClickCtx) msgClickCtx = new AC();
            if (msgClickCtx.state === 'suspended') msgClickCtx.resume();
            const ctx = msgClickCtx;
            const dur = 0.03;
            const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * dur), ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
                // Затухающий шум — сухой «клац», без звона.
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 3);
            }
            const src = ctx.createBufferSource();
            src.buffer = buf;
            const hp = ctx.createBiquadFilter();
            hp.type = 'highpass';
            hp.frequency.value = 1400;
            const gain = ctx.createGain();
            gain.gain.value = 0.22;
            src.connect(hp).connect(gain).connect(ctx.destination);
            src.start();
        } catch (e) { /* звук печати необязателен — молча пропускаем */ }
    }

    let msgTypeSound = true;

    // Кегль под длину текста. Считаем по итоговой строке, а не по уже
    // напечатанной части, иначе буквы прыгали бы в размере во время печати.
    // Нижняя граница жёсткая: на кинескопе 800×600 мельче 4.6vmin (≈28px)
    // текст с дивана уже не читается, лучше обрезать сообщение по длине.
    function msgFontSize(text) {
        const n = text.length;
        if (n <= 20) return 8.5;
        if (n <= 45) return 7;
        if (n <= 90) return 5.8;
        if (n <= 160) return 5;
        return 4.6;
    }

    function tvShowMessage(cmd) {
        clearTimeout(msgTypeTimer);
        clearTimeout(msgHoldTimer);
        const text = String(cmd.text || '');
        const speed = Math.max(5, Math.min(400, Number(cmd.speed) || 45));
        msgTypeSound = cmd.beep !== false;
        msgOverlay.style.setProperty('--msg-size', msgFontSize(text) + 'vmin');

        msgOverlay.classList.add('active');
        msgOverlay.classList.remove('done');
        // Пока не решено иначе — сообщение перекрывает всё глухим чёрным.
        // Поверх картинки показываем полупрозрачно, но с плотной плашкой.
        msgOverlay.classList.toggle('overlay', !!cmd.over_video);
        msgBody.textContent = '';

        const finish = () => {
            msgOverlay.classList.add('done');
            const hold = Number(cmd.hold) || 0;
            if (hold > 0) msgHoldTimer = setTimeout(tvHideMessage, hold * 1000);
        };

        if (cmd.instant) {
            msgBody.textContent = text;
            finish();
            return;
        }

        let i = 0;
        const step = () => {
            if (i >= text.length) { finish(); return; }
            const ch = text[i++];
            msgBody.textContent += ch;
            if (ch.trim()) msgClick();
            // Пауза после точки/запятой — печать звучит живее ровного тика.
            let wait = speed;
            if ('.!?'.includes(ch)) wait = speed * 7;
            else if (',;:'.includes(ch)) wait = speed * 3;
            else if (ch === '\n') wait = speed * 5;
            msgTypeTimer = setTimeout(step, wait);
        };
        step();
    }

    function tvHideMessage() {
        clearTimeout(msgTypeTimer);
        clearTimeout(msgHoldTimer);
        msgOverlay.classList.remove('active', 'done', 'overlay');
        msgBody.textContent = '';
    }

    // ── Инструкция к дисковому набору ──
    //
    // Карточка телефона выдаёт трёхзначный номер, а набирают его на аппарате
    // 1968 года. Половина стола такого диска в руках не держала, поэтому набор
    // показывается, а не объясняется: диск проворачивается до упора, отпускается
    // и возвращается сам, отсчитывая импульсы, — и так по цифре, циклом, пока
    // номер не наберут по-настоящему.
    //
    // Цифры в анимации — те, что выдал сервер. Гайд, крутящий произвольное
    // число, учил бы набирать не тот номер.
    const rgOverlay = document.getElementById('tv-rotary');
    const rgSvgNS = 'http://www.w3.org/2000/svg';
    const RG_CX = 310, RG_CY = 310, RG_RING = 188, RG_HOLE_R = 40;

    let rgHoles = [];        // по отверстию на цифру: угол до упора и координаты
    let rgTicks = [];        // вспышки на ободе, по одной на импульс
    let rgSlots = [];        // знакоместа номера под диском
    let rgNumber = '';       // номер, который надо набрать
    let rgTimers = [];       // всё, что заведено текущим циклом
    let rgRunning = false;   // цикл идёт — второй запускать нельзя
    let rgGen = 0;           // номер поколения: смена номера обрывает старый цикл

    function rgEl(tag, attrs) {
        const n = document.createElementNS(rgSvgNS, tag);
        for (const k in attrs) n.setAttribute(k, attrs[k]);
        return n;
    }

    // Диск строится один раз на всю жизнь страницы: отверстия и обод импульсов
    // от номера не зависят, а перестроение на каждую карточку заставляло бы
    // браузер телевизора пересчитывать три десятка SVG-узлов на ровном месте.
    let rgBuilt = false;
    function rgBuild() {
        if (rgBuilt) return;
        rgBuilt = true;

        const wheel = document.getElementById('rg-wheel');
        const tickRing = document.getElementById('rg-ticks');
        // Как на аппарате: 1 ближе всего к упору, 0 дальше всех — десять
        // импульсов и самая долгая цифра.
        const order = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'];
        const letters = {'2':'АБВ','3':'ГДЕ','4':'ЖЗИ','5':'КЛМ','6':'НОП','7':'РСТ','8':'УФХ','9':'ЦЧШ'};

        order.forEach((d, idx) => {
            const rot = (idx + 1) * 30;              // сколько градусов до упора
            const rad = (-rot) * Math.PI / 180;      // 0 — восток, по часовой
            const hx = RG_CX + RG_RING * Math.cos(rad);
            const hy = RG_CY + RG_RING * Math.sin(rad);

            const hole = rgEl('circle', {'class': 'rg-hole', cx: hx.toFixed(2), cy: hy.toFixed(2), r: RG_HOLE_R});
            const digit = rgEl('text', {'class': 'rg-digit', x: hx.toFixed(2), y: hy.toFixed(2)});
            digit.textContent = d;
            wheel.appendChild(hole);
            wheel.appendChild(digit);

            if (letters[d]) {
                const lx = RG_CX + (RG_RING + 56) * Math.cos(rad);
                const ly = RG_CY + (RG_RING + 56) * Math.sin(rad);
                const lt = rgEl('text', {'class': 'rg-letters', x: lx.toFixed(2), y: ly.toFixed(2)});
                lt.textContent = letters[d];
                wheel.appendChild(lt);
            }

            rgHoles.push({digit: d, rot: rot, hole: hole, label: digit, x: hx, y: hy});
        });

        for (let t = 0; t < 10; t++) {
            const a = (-(t + 1) * 30 + 15) * Math.PI / 180;
            const tx = RG_CX + 258 * Math.cos(a);
            const ty = RG_CY + 258 * Math.sin(a);
            const tick = rgEl('circle', {'class': 'rg-tick', cx: tx.toFixed(2), cy: ty.toFixed(2), r: 9});
            tickRing.appendChild(tick);
            rgTicks.push(tick);
        }
    }

    // Знакоместа — по одному на цифру номера. Номера трёхзначные, но длина
    // берётся из самого номера: она задана на сервере (tts/sessions.py), и
    // зашитая тройка здесь разошлась бы с ней молча.
    //
    // Номер стоит здесь целиком с первого кадра. Раньше цифры проявлялись по
    // ходу анимации диска, и игрок, подошедший к аппарату посреди цикла, видел
    // «8 7 _» — номер, которого не существует. Диск показывает, КАК набирать;
    // что набирать, написано внизу и не меняется.
    function rgBuildSlots(number) {
        const box = document.getElementById('rg-slots');
        box.textContent = '';
        rgSlots = [];
        for (let i = 0; i < number.length; i++) {
            const slot = document.createElement('div');
            slot.className = 'rg-slot filled';
            slot.textContent = number[i];
            box.appendChild(slot);
            rgSlots.push(slot);
        }
        document.getElementById('rg-label').textContent =
            'НОМЕР · ' + number.length + (number.length === 1 ? ' ЦИФРА' : ' ЦИФРЫ');
    }

    function rgFireTick(i) {
        const n = rgTicks[i % rgTicks.length];
        if (!n) return;
        n.classList.remove('on');
        void n.getBoundingClientRect().width;   // перезапуск анимации требует reflow
        n.classList.add('on');
    }

    // Таймауты цикла держим списком: смена номера или закрытие гайда должны
    // обрывать анимацию мгновенно, а она — цепочка из десятков отложенных шагов.
    function rgWait(ms) {
        return new Promise(resolve => {
            const id = setTimeout(resolve, ms);
            rgTimers.push(id);
        });
    }

    function rgClearTimers() {
        rgTimers.forEach(clearTimeout);
        rgTimers = [];
    }

    function rgStatus(text) {
        document.getElementById('rg-status').textContent = text;
    }

    // Между повторами цикла снимается только подсветка «сейчас набирается».
    // Сами цифры остаются: номер на экране постоянен, меняется лишь то, какую
    // из них показывает диск.
    function rgResetSlots() {
        rgSlots.forEach(s => s.classList.remove('filling'));
    }

    // Одна цифра: палец в отверстие, поворот до упора, отпустить, возврат с
    // импульсами. Длительности подобраны под настоящий диск — возврат идёт с
    // постоянной скоростью, поэтому 0 (десять импульсов) заметно дольше 1.
    function rgDialDigit(meta, slotIndex, gen) {
        const slot = rgSlots[slotIndex];
        const wheel = document.getElementById('rg-wheel');
        const finger = document.getElementById('rg-finger');
        const fRing = document.getElementById('rg-f-ring');
        const hubNum = document.getElementById('rg-hub-num');
        const alive = () => gen === rgGen;

        if (slot) slot.classList.add('filling');
        meta.hole.classList.add('lit');
        meta.label.classList.add('lit');
        hubNum.textContent = meta.digit;
        rgStatus('ЦИФРА ' + meta.digit + ' · ПАЛЕЦ В ОТВЕРСТИИ');

        // Метку двигаем самим кружком, а группу только вращаем: сдвиг группы
        // увёл бы и центр вращения вместе с ней.
        fRing.setAttribute('cx', meta.x.toFixed(2));
        fRing.setAttribute('cy', meta.y.toFixed(2));
        finger.style.transition = 'none';
        finger.style.transform = 'rotate(0deg)';
        void finger.getBoundingClientRect().width;   // зафиксировать сброс до анимации
        finger.classList.add('show');

        return rgWait(700).then(() => {
            if (!alive()) return;
            rgStatus('ПОВОРОТ ДО УПОРА');
            const pull = 520 + meta.rot * 6;
            const ease = 'cubic-bezier(.34,0,.5,1)';
            wheel.style.transition = 'transform ' + pull + 'ms ' + ease;
            wheel.style.transform = 'rotate(' + meta.rot + 'deg)';
            finger.style.transition = 'transform ' + pull + 'ms ' + ease + ',opacity .28s';
            finger.style.transform = 'rotate(' + meta.rot + 'deg)';
            return rgWait(pull + 420);
        }).then(() => {
            if (!alive()) return;
            rgStatus('ОТПУЩЕН · ИМПУЛЬСЫ');
            finger.classList.remove('show');

            const count = (meta.digit === '0') ? 10 : parseInt(meta.digit, 10);
            const back = 420 + count * 105;   // возврат идёт с постоянной скоростью

            wheel.style.transition = 'transform ' + back + 'ms linear';
            wheel.style.transform = 'rotate(0deg)';

            for (let i = 0; i < count; i++) {
                const id = setTimeout(() => { if (alive()) rgFireTick(i); },
                                      back * (i + 0.5) / count);
                rgTimers.push(id);
            }
            return rgWait(back + 120);
        }).then(() => {
            if (!alive()) return;
            // Цифра уже стоит в слоте с самого начала — здесь только снимаем
            // с неё пометку «эту набирают сейчас».
            if (slot) slot.classList.remove('filling');
            meta.hole.classList.remove('lit');
            meta.label.classList.remove('lit');
            finger.style.transition = 'opacity .28s';
            finger.style.transform = 'rotate(0deg)';
        });
    }

    async function rgRunCycle(gen) {
        const hubNum = document.getElementById('rg-hub-num');
        while (gen === rgGen) {
            rgResetSlots();
            hubNum.textContent = '—';
            rgStatus('ГОТОВ К НАБОРУ');
            await rgWait(1300);
            if (gen !== rgGen) return;

            for (let i = 0; i < rgNumber.length; i++) {
                const meta = rgHoles.find(h => h.digit === rgNumber[i]);
                if (!meta) continue;
                await rgDialDigit(meta, i, gen);
                if (gen !== rgGen) return;
                if (i < rgNumber.length - 1) {
                    rgStatus('ДИСК ОСТАНОВИЛСЯ · СЛЕДУЮЩАЯ ЦИФРА');
                    await rgWait(900);
                    if (gen !== rgGen) return;
                }
            }

            hubNum.textContent = '—';
            rgStatus('НОМЕР НАБРАН · ИДУТ ГУДКИ');
            await rgWait(2600);
            if (gen !== rgGen) return;
            rgStatus('ПОВТОР ПОКАЗА...');
            await rgWait(1500);
        }
    }

    // Обратного отсчёта на этом экране нет. Срок у номера остался (сервер гасит
    // его сам, см. tts/sessions.py), но человеку, который стоит у аппарата с
    // трубкой и первый раз в жизни крутит диск, тикающие цифры мешают: он
    // торопится и путает набор вместо того, чтобы читать номер.

    function rgShow(cmd) {
        const number = String(cmd.number || '').replace(/\D/g, '');
        if (!number) return;

        rgBuild();
        // Новое поколение обрывает предыдущий цикл: игрок может применить
        // вторую карточку, пока крутится первый номер, и два цикла на одном
        // диске рвали бы анимацию друг друга.
        rgGen++;
        rgClearTimers();
        const gen = rgGen;

        rgNumber = number;
        rgBuildSlots(number);
        rgOverlay.classList.add('active');

        // Цикл всегда новый: старый уже обречён сменой поколения выше, а ждать
        // его завершения значило бы держать экран на прошлом номере.
        rgRunning = true;
        rgRunCycle(gen).finally(() => {
            if (gen === rgGen) rgRunning = false;
        });
    }

    function rgHide() {
        rgGen++;              // обрывает цикл, который сейчас в воздухе
        rgClearTimers();
        rgRunning = false;
        rgOverlay.classList.remove('active');
        // Диск возвращаем в исходное: следующий показ начинается с нуля, а не
        // с угла, на котором его застали.
        const wheel = document.getElementById('rg-wheel');
        const finger = document.getElementById('rg-finger');
        if (wheel) { wheel.style.transition = 'none'; wheel.style.transform = 'rotate(0deg)'; }
        if (finger) { finger.classList.remove('show'); finger.style.transform = 'rotate(0deg)'; }
        rgHoles.forEach(h => { h.hole.classList.remove('lit'); h.label.classList.remove('lit'); });
    }

    // Notify server when video ends, and manage game sound muting
    videoEl.addEventListener('play', () => {
        if (tvMutesGameSound && window.SoundEngine) window.SoundEngine.setMuted(true);
    });
    
    videoEl.addEventListener('pause', () => {
        // Пауза посреди ролика — не конец ролика. Пока оверлей на экране,
        // звук игры остаётся выключенным, иначе музыка вернётся под стоп-кадр.
        if (videoOverlay.classList.contains('active') && !videoEl.ended) return;
        if (window.SoundEngine) window.SoundEngine.setMuted(false);
    });

    videoEl.addEventListener('ended', () => {
        if (!videoEl.loop) {
            videoOverlay.classList.remove('active');
            if (window.SoundEngine) window.SoundEngine.setMuted(false);
            if (tvWs && tvWs.readyState === WebSocket.OPEN) {
                tvWs.send(JSON.stringify({ event: 'ended' }));
            }
        }
    });

    // ── CCTV camera mode (runs entirely on this TV device) ──
    // The TV owns the random auto-cycle timer and the fake-error glitch.
    // The dealer only pushes settings + a manual on/off. No cross-device sync.
    const cctvOverlay = document.getElementById('tv-cctv-overlay');
    let cctvCfg = {
        auto_enabled: true, min_time: 30, max_time: 120, min_show: 2, max_show: 10,
        mode: 'random', cameras: ['cam1', 'cam2', 'cam3', 'cam4'],
        fake_error: { enabled: false, chance: 0.25, interval: 15, duration: 4 },
        degrade: { enabled: false, level: 50 }
    };
    let cctvShown = false;      // overlay currently visible
    let cctvManual = false;     // held on by dealer's manual toggle
    let cctvPhaseOk = false;    // game phase allows auto-show (round / waiting)
    let cctvAutoTimer = null;   // schedules the next auto show
    let cctvHideTimer = null;   // ends the current auto show
    let cctvFaultTimer = null;  // fake-error tick

    function cctvRnd(min, max) {
        min = Number(min); max = Number(max);
        if (!(max >= min)) max = min;
        return min + Math.random() * (max - min);
    }

    // Choose a rows×cols grid for n cells on a 4:3 screen, preferring the
    // layout whose cells come closest to 4:3 themselves. Returns the column
    // count plus how many cells sit in the (possibly short) last row.
    function cctvGridFor(n) {
        const SCREEN = 4 / 3;
        let best = null;
        for (let cols = 1; cols <= n; cols++) {
            const rows = Math.ceil(n / cols);
            // Aspect of one cell if the screen is split rows×cols.
            const cell = (SCREEN / cols) / (1 / rows);
            // Penalise cell shapes far from 4:3, and ragged last rows —
            // a full rectangle always beats an equally-shaped ragged one.
            const shape = Math.abs(Math.log(cell / SCREEN));
            const ragged = (rows * cols - n) * 0.15;
            // Camera feeds are landscape: on an exact tie (2×1 vs 1×2) prefer
            // the wider cell, never the tall sliver.
            const portrait = cell < SCREEN ? 0.01 : 0;
            const score = shape + ragged + portrait;
            if (!best || score < best.score) best = { cols, rows, score };
        }
        return best;
    }

    let cctvPersistentFrames = {};

    function cctvInitFrames() {
        const host = location.hostname;
        const pool = (cctvCfg.cameras && cctvCfg.cameras.length) ? cctvCfg.cameras : ['cam1','cam2','cam3','cam4'];
        
        // Remove ones not in pool
        for (const cam of Object.keys(cctvPersistentFrames)) {
            if (!pool.includes(cam)) {
                cctvPersistentFrames[cam].remove();
                delete cctvPersistentFrames[cam];
            }
        }
        
        for (const cam of pool) {
            if (!cctvPersistentFrames[cam]) {
                const cell = document.createElement('div');
                cell.className = 'cctv-cell';
                cell.dataset.cam = cam;
                cell.style.display = 'none';
                
                cell.innerHTML = `
                    <div class="cctv-label">${cam.toUpperCase()} [REC]</div>
                    <iframe class="cctv-frame" scrolling="no" src="http://${host}:8889/${encodeURIComponent(cam)}/"></iframe>
                    <img class="cctv-offline-bg" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:92; display:none;" src="" />
                    <div class="cctv-scan"></div>
                    <div class="cctv-grain"></div>
                `;
                cctvOverlay.appendChild(cell);
                cctvPersistentFrames[cam] = cell;

                // Randomize panning animation for each camera
                const frame = cell.querySelector('.cctv-frame');
                const dur = 15 + Math.random() * 15;
                const del = -(Math.random() * dur);
                frame.style.animationDuration = dur + 's';
                frame.style.animationDelay = del + 's';
            }
        }
    }

    // Build the camera grid using preloaded persistent iframes.
    function cctvRender(cams) {
        const n = cams.length;
        if (n === 0) return;
        const { cols, rows } = cctvGridFor(n);
        cctvOverlay.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        cctvOverlay.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

        // How many cells the last row holds, and how wide each must be (in
        // column tracks) to span the full width. Uneven remainders give the
        // first cells one extra track each.
        const lastCount = n - cols * (rows - 1);
        const firstOfLast = n - lastCount;

        // Hide all first
        Object.values(cctvPersistentFrames).forEach(cell => {
            cell.style.display = 'none';
            cell.style.gridColumn = '';
        });

        cams.forEach((cam, i) => {
            const cell = cctvPersistentFrames[cam];
            if (!cell) return;
            
            cell.style.display = 'block';
            
            if (i >= firstOfLast && lastCount < cols) {
                const idx = i - firstOfLast;
                const base = Math.floor(cols / lastCount);
                const extra = cols % lastCount;
                cell.style.gridColumn = `span ${base + (idx < extra ? 1 : 0)}`;
            }
        });

        cctvApplyDegrade();
    }

    // Toggle + strength of the artificial degradation overlay.
    function cctvApplyDegrade() {
        const dg = cctvCfg.degrade || {};
        const on = !!dg.enabled;
        const level = Math.max(0, Math.min(100, Number(dg.level ?? 50)));
        // Overlay-level --dg is the baseline (static mode, and the starting
        // value for cells before their first drift roll).
        cctvOverlay.style.setProperty('--dg', (level / 100).toFixed(3));
        cctvOverlay.classList.toggle('degrade', on);
        cctvOverlay.classList.toggle('hq-degrade', !!dg.hq);
        cctvOverlay.classList.toggle('panning', !!cctvCfg.panning);
        
        // UI Noise
        const uiLevel = level * 0.5; // Half strength for UI readability
        document.getElementById('tv-ui-noise').style.setProperty('--dg', (uiLevel / 100).toFixed(3));
        document.getElementById('tv-ui-scan').style.setProperty('--dg', (uiLevel / 100).toFixed(3));
        document.body.classList.toggle('ui-noise-active', !!dg.ui);
        document.body.classList.toggle('hq-degrade', !!dg.hq);
        
        if (on && dg.dynamic) cctvStartDrift();
        else cctvStopDrift();
    }

    // ── Stream Status Polling (MediaMTX API) ──
    let cctvErrorImages = [];
    let currentOfflineImg = null;
    let prevAnyOffline = false;

    function rollCctvErrorImage() {
        if (!cctvErrorImages.length) return;
        currentOfflineImg = cctvErrorImages[Math.floor(Math.random() * cctvErrorImages.length)];
        Object.values(cctvPersistentFrames).forEach(cell => {
            const bg = cell.querySelector('.cctv-offline-bg');
            if (bg) bg.src = `/static/cctv_errors/${currentOfflineImg}`;
        });
    }

    fetch('/api/cctv/errors').then(r => r.json()).then(d => { 
        cctvErrorImages = d.images || []; 
        rollCctvErrorImage();
    });

    setInterval(async () => {
        if (!cctvShown || !cctvErrorImages.length) return;
        try {
            const res = await fetch(`http://${location.hostname}:9997/v3/paths/list`);
            const data = await res.json();
            const activeStreams = (data.items || []).map(p => p.name);
            
            let anyOffline = false;
            Object.keys(cctvPersistentFrames).forEach(cam => {
                if (!activeStreams.includes(cam) || cctvPersistentFrames[cam].classList.contains('faulted')) {
                    anyOffline = true;
                }
            });
            
            if (!anyOffline && prevAnyOffline) {
                rollCctvErrorImage(); // Roll a new image for the next time it breaks
            }
            prevAnyOffline = anyOffline;
            
            Object.keys(cctvPersistentFrames).forEach(cam => {
                const cell = cctvPersistentFrames[cam];
                const isOnline = activeStreams.includes(cam);
                const offlineBg = cell.querySelector('.cctv-offline-bg');
                
                if (isOnline) {
                    offlineBg.style.display = 'none';
                } else {
                    if (offlineBg.style.display !== 'block') {
                        offlineBg.style.display = 'block';
                    }
                }
            });
        } catch(e) {}
    }, 2000);

    // ── Dynamic degradation drift ──
    // Every `interval` seconds each visible camera independently re-rolls its own
    // degradation level inside [min_level, max_level]. Cells are staggered by a
    // random phase so they never change together.
    let cctvDriftTimer = null;

    function cctvDriftCell(cell) {
        const dg = cctvCfg.degrade || {};
        const lo = Math.max(0, Math.min(100, Number(dg.min_level ?? 10)));
        const hi = Math.max(lo, Math.min(100, Number(dg.max_level ?? 85)));
        const level = cctvRnd(lo, hi);
        cell.style.setProperty('--dg', (level / 100).toFixed(3));
    }

    function cctvStartDrift() {
        cctvStopDrift();
        const dg = cctvCfg.degrade || {};
        const interval = Math.max(1, Number(dg.interval ?? 6)) * 1000;
        // Seed immediately so the effect is visible without waiting a full tick.
        cctvOverlay.querySelectorAll('.cctv-cell').forEach(cctvDriftCell);
        cctvDriftTimer = setInterval(() => {
            cctvOverlay.querySelectorAll('.cctv-cell').forEach(cell => {
                // Random stagger inside the tick keeps cameras out of lockstep.
                setTimeout(() => cctvDriftCell(cell), Math.random() * interval * 0.8);
            });
        }, interval);
    }

    function cctvStopDrift() {
        clearInterval(cctvDriftTimer); cctvDriftTimer = null;
        // Fall back to the overlay baseline level.
        cctvOverlay.querySelectorAll('.cctv-cell').forEach(c => c.style.removeProperty('--dg'));
    }

    // Per-camera visibility set by the dealer: "rare" or "blocked".
    // Anything absent is a normal camera.
    function cctvVis(cam) {
        return (cctvCfg.visibility || {})[cam] || 'normal';
    }

    // Cameras the player may see in the regular rotation — блок и «редкие»
    // сюда не попадают, редкие приходят только через прорыв ниже.
    function cctvNormalPool() {
        const all = (cctvCfg.cameras && cctvCfg.cameras.length) ? cctvCfg.cameras : ['cam1'];
        return all.filter(cam => cctvVis(cam) === 'normal');
    }

    function cctvRarePool() {
        const all = cctvCfg.cameras || [];
        return all.filter(cam => cctvVis(cam) === 'rare');
    }

    // Pick which cameras to show for one show, per mode.
    //  single — one random camera; grid — all enabled cameras;
    //  random — coin-flip between those two: either one random camera
    //           fullscreen, or the full grid. No partial subsets.
    // Перед обычным раскладом бросаем кубик на «редкую» камеру: с шансом
    // rare_chance весь показ подменяется одной редкой камерой на весь экран.
    // Для игрока это выглядит как случайный сбой, показавший закулисье.
    function cctvPickCams() {
        const rare = cctvRarePool();
        const chance = Math.max(0, Math.min(100, Number(cctvCfg.rare_chance ?? 10))) / 100;
        if (rare.length && Math.random() < chance) {
            return [rare[Math.floor(Math.random() * rare.length)]];
        }
        const pool = cctvNormalPool();
        // Все обычные камеры заблокированы или помечены редкими — обычному
        // показу нечего рисовать, поэтому пропускаем его целиком.
        if (!pool.length) return [];
        const one = () => [pool[Math.floor(Math.random() * pool.length)]];
        if (cctvCfg.mode === 'single') return one();
        if (cctvCfg.mode === 'random') return Math.random() < 0.5 ? one() : pool.slice();
        return pool.slice();  // grid
    }

    function cctvShow(cams) {
        // Пустой набор — все камеры заблокированы или редкие и не выпали.
        // Включать оверлей нельзя: игрок увидит чёрный прямоугольник вместо
        // картинки с камер.
        if (!cams || !cams.length) { cctvHide(); return; }
        cctvRender(cams);
        cctvOverlay.classList.add('active');
        cctvShown = true;
        cctvStartFaults();
    }

    function cctvHide() {
        clearTimeout(cctvHideTimer); cctvHideTimer = null;
        cctvStopFaults();
        cctvStopDrift();
        cctvOverlay.classList.remove('active');
        // persistent iframes remain in DOM, just hidden by the parent's display:none
        cctvShown = false;
    }

    // Transition noise effect
    let cctvTransitionTimer1 = null;
    let cctvTransitionTimer2 = null;
    // Со звуком автозапуск запрещён, пока на странице не было жеста. Экран TV
    // обычно никто не трогает, поэтому до первого жеста играем беззвучно —
    // картинка перехода важнее звука и пропадать не должна.
    let cctvAudioUnlocked = false;
    ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
        window.addEventListener(ev, function () { cctvAudioUnlocked = true; }, { once: true });
    });
    function playCctvTransition(callback) {
        const vid = document.getElementById('tv-cctv-transition');
        clearTimeout(cctvTransitionTimer1);
        clearTimeout(cctvTransitionTimer2);

        vid.style.display = 'block';
        vid.currentTime = 0;
        vid.muted = !cctvAudioUnlocked;
        // Картинку показываем сразу, а старт откладываем до применения sink,
        // иначе первые кадры шума прозвучат на устройстве по умолчанию.
        // Если sink не применился, всё равно играем — визуал важнее.
        const go = () => {
            const p = vid.play();
            if (p) p.catch(() => {
                // Браузер отказал из-за звука — доигрываем беззвучно.
                if (!vid.muted) { vid.muted = true; const r = vid.play(); if (r) r.catch(() => {}); }
            });
        };
        cctvSinkReady.then(go, go);

        // At 300ms, execute the switch (show/hide CCTV) underneath the static
        cctvTransitionTimer1 = setTimeout(() => {
            callback();
            // Wait another 300ms then hide the static
            cctvTransitionTimer2 = setTimeout(() => {
                vid.style.display = 'none';
                vid.pause();
            }, 300);
        }, 300);
    }

    // Dealer manual button: force on (grid of all enabled) / off.
    function cctvManualToggle(active) {
        cctvManual = !!active;
        if (cctvManual) {
            clearTimeout(cctvHideTimer); cctvHideTimer = null;
            playCctvTransition(() => cctvShow(cctvPickCams()));
        } else {
            playCctvTransition(() => cctvHide());
        }
    }

    // Dealer picked an exact camera (or several) to put in front of the player.
    // Behaves like a manual hold: auto-cycle stays paused until the dealer
    // turns CCTV off again.
    function cctvShowSpecific(cams) {
        // Блок уважаем и здесь, а не только на сервере: телевизор — последняя
        // точка перед глазами игрока, и запрет не должен зависеть от того,
        // кто именно прислал команду.
        cams = (cams || []).filter(Boolean).filter(cam => cctvVis(cam) !== 'blocked');
        if (!cams.length) return;
        clearTimeout(cctvHideTimer); cctvHideTimer = null;
        clearTimeout(cctvAutoTimer); cctvAutoTimer = null;
        cctvManual = true;
        playCctvTransition(() => cctvShow(cams));
    }

    function cctvScheduleNext() {
        // Dealer explicitly handles auto-cycle now via WebSockets
    }

    // Called from updateUI on every game-state push. Cameras cut in at random
    // moments regardless of game phase — including the lobby and after game
    // over — so the TV behaves like a live CCTV feed from the moment it boots.
    function cctvSetPhase(phase) {
        if (cctvPhaseOk) return;
        cctvPhaseOk = true;
        cctvScheduleNext();
    }

    // Fake "signal lost" — cosmetic, only while the overlay is visible.
    function cctvStartFaults() {
        cctvStopFaults();
        const fe = cctvCfg.fake_error || {};
        if (!fe.enabled) return;
        cctvFaultTimer = setInterval(() => {
            if (!cctvShown) return;
            cctvOverlay.querySelectorAll('.cctv-cell').forEach(cell => {
                if (cell.classList.contains('faulted')) return;
                if (Math.random() < (fe.chance || 0)) {
                    cell.classList.add('faulted');
                    setTimeout(() => cell.classList.remove('faulted'), (fe.duration || 4) * 1000);
                }
            });
        }, Math.max(1, fe.interval || 15) * 1000);
    }
    function cctvStopFaults() {
        clearInterval(cctvFaultTimer); cctvFaultTimer = null;
        cctvOverlay.querySelectorAll('.cctv-cell.faulted').forEach(c => c.classList.remove('faulted'));
    }

    // Apply a settings push from the dealer and (re)start the auto loop.
    // ── Диагностика камер на экране TV ────────────────────────────────────
    // MediaMTX пишет диагностику в stdout, который раньше уходил в никуда.
    // Сервер перехватывает его и отдаёт через /api/cctv/log; здесь показываем
    // на самом телевизоре, чтобы настраивать камеры, не отходя к ноутбуку.
    // Скрыто по умолчанию — игрокам служебный лог видеть незачем.
    let camDiagOn = false;
    let camDiagSince = 0;
    let camDiagTimer = null;

    function camDiagToggle() {
        camDiagOn = !camDiagOn;
        document.body.classList.toggle('cam-diag-on', camDiagOn);
        if (camDiagOn) {
            camDiagPoll();
            camDiagTimer = setInterval(camDiagPoll, 2000);
        } else {
            clearInterval(camDiagTimer);
            camDiagTimer = null;
        }
    }

    async function camDiagPoll() {
        try {
            const r = await fetch(`/api/cctv/log?since=${camDiagSince}`);
            const d = await r.json();
            camDiagSince = d.now || camDiagSince;

            const st = document.getElementById('cam-diag-state');
            st.textContent = d.running ? (d.external ? 'ЗАПУЩЕН ИЗВНЕ' : 'ЗАПУЩЕН') : 'НЕ ЗАПУЩЕН';
            st.className = d.running && !d.external ? 'cam-diag-ok' : 'cam-diag-bad';

            const notes = document.getElementById('cam-diag-notes');
            notes.textContent = (d.notes && d.notes.length) ? '⚠ ' + d.notes.join(' ') : '';
            notes.style.display = (d.notes && d.notes.length) ? 'block' : 'none';

            document.getElementById('cam-diag-url').textContent = d.srt_url || '—';

            const pathsEl = document.getElementById('cam-diag-paths');
            if (d.api_error) {
                pathsEl.innerHTML = `<span class="cam-diag-bad">API недоступен: ${d.api_error}</span>`;
            } else if (!d.paths || !d.paths.length) {
                pathsEl.innerHTML = '<span class="cam-diag-bad">нет активных потоков</span>';
            } else {
                pathsEl.innerHTML = d.paths.map(p =>
                    `<span class="${p.ready ? 'cam-diag-ok' : 'cam-diag-bad'}">${p.name}${p.ready ? '' : ' (не готов)'}</span>`
                ).join(', ');
            }

            const logEl = document.getElementById('cam-diag-log');
            (d.lines || []).forEach(e => {
                const row = document.createElement('div');
                row.className = 'lv-' + e.level;
                row.textContent = e.line;
                logEl.appendChild(row);
            });
            // Держим в DOM только хвост, иначе за вечер накопится тысячи строк.
            while (logEl.childElementCount > 200) logEl.removeChild(logEl.firstChild);
            if (d.lines && d.lines.length) logEl.scrollTop = logEl.scrollHeight;
        } catch (e) {
            const st = document.getElementById('cam-diag-state');
            st.textContent = 'СЕРВЕР НЕДОСТУПЕН';
            st.className = 'cam-diag-bad';
        }
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'l' || e.key === 'L' || e.key === 'д' || e.key === 'Д') camDiagToggle();
    });

    // ── Реактивные ЭЛТ-эффекты ────────────────────────────────────────────
    // Телевизор реагирует на события партии. Сложность в том, что по WebSocket
    // приходит СНИМОК состояния, а не события: чтобы понять «выстрелили», надо
    // сравнить новый снимок с предыдущим. fxOnState() делает этот diff и
    // дёргает нужные эффекты.
    //
    // Каждый эффект = тумблер (enabled) + степень 0..100 (level). Степень —
    // множитель силы: 0 означает «включён, но не виден», что позволяет
    // оператору убавлять эффект во время игры, не выключая его совсем.
    const FX_DEFAULTS = {
        shot_enabled: true,  shot_level: 70,
        hp_enabled: true,    hp_level: 60,
        death_enabled: true, death_level: 80,
        pending_enabled: true, pending_level: 45,
        afterglow_enabled: false, afterglow_level: 50,
    };
    let fxCfg = Object.assign({}, FX_DEFAULTS);

    const fxRoot = document.getElementById('fx-reactive');
    const fxHpEl = document.getElementById('fx-hp');
    const fxBurstEl = document.getElementById('fx-burst');
    const fxFlashEl = document.getElementById('fx-flash');

    // Предыдущий снимок — база для diff. null до первого сообщения, чтобы
    // подключение к идущей партии не выглядело как «всех только что убили».
    let fxPrev = null;
    let fxBurstTimer = null, fxFlashTimer = null, fxRolloutTimer = null;

    // Степень 0..100 -> множитель 0..1.
    const fxAmt = (level) => Math.max(0, Math.min(100, Number(level ?? 0))) / 100;

    function fxSetConfig(cfg) {
        fxCfg = Object.assign({}, fxCfg, cfg || {});
        // Тумблеры, влияющие на постоянные слои, применяем сразу — оператор
        // должен видеть результат, не дожидаясь следующего события.
        if (!fxCfg.hp_enabled) fxHpEl.style.setProperty('--hp-fx', 0);
        if (!fxCfg.pending_enabled) fxSetTremor(false);
        fxApplyAfterglow();
        if (fxPrev) fxApplyHpNoise(fxPrev);
    }

    // Послесвечение люминофора — постоянный слой, зависит только от настроек.
    function fxApplyAfterglow() {
        const on = !!fxCfg.afterglow_enabled;
        document.body.classList.toggle('fx-afterglow', on);
        document.body.style.setProperty('--glow', on ? fxAmt(fxCfg.afterglow_level).toFixed(3) : 0);
    }

    // Шум тем сильнее, чем ниже HP: полное здоровье — чистая картинка,
    // 1 HP — телевизор еле держит сигнал. Показываем ТОЛЬКО своё HP.
    function fxApplyHpNoise(data) {
        if (!fxCfg.hp_enabled || !data || !data.my_alive) {
            if (!fxCfg.hp_enabled) fxHpEl.style.setProperty('--hp-fx', 0);
            return;
        }
        const hp = Number(data.my_hp ?? 0), max = Number(data.my_max_hp ?? 0);
        if (!(max > 0) || hp <= 0) return;
        // Доля потерянного здоровья, возведённая в квадрат: пока HP высокое,
        // картинка почти чистая, а у последнего деления шум резко нарастает.
        const lost = 1 - (hp / max);
        fxHpEl.style.setProperty('--hp-fx', (lost * lost * fxAmt(fxCfg.hp_level) * 0.85).toFixed(3));
    }

    // Всплеск помех + вспышка кадра. Используется выстрелом и смертью.
    function fxBurst(level, withFlash) {
        const amt = fxAmt(level);
        if (amt <= 0) return;
        fxBurstEl.style.setProperty('--burst', (amt * 0.9).toFixed(3));
        clearTimeout(fxBurstTimer);
        fxBurstTimer = setTimeout(() => fxBurstEl.style.setProperty('--burst', 0), 260);

        if (withFlash) {
            fxFlashEl.style.setProperty('--flash', (amt * 0.55).toFixed(3));
            clearTimeout(fxFlashTimer);
            fxFlashTimer = setTimeout(() => fxFlashEl.style.setProperty('--flash', 0), 90);
        }
    }

    // Срыв вертикальной синхронизации — кадр уезжает и схлопывается в полосу.
    function fxRollout(level) {
        const amt = fxAmt(level);
        if (amt <= 0) return;
        // Чем выше степень, тем дольше и заметнее срыв (0.45s..1.15s).
        document.body.style.setProperty('--rollout-dur', (0.45 + amt * 0.7).toFixed(2) + 's');
        document.body.classList.remove('fx-rollout');
        void document.body.offsetWidth;  // рестарт анимации
        document.body.classList.add('fx-rollout');
        clearTimeout(fxRolloutTimer);
        fxRolloutTimer = setTimeout(() => document.body.classList.remove('fx-rollout'), 1300);
    }

    function fxSetTremor(on) {
        document.body.classList.toggle('fx-tremor', on);
        if (on) document.body.style.setProperty('--tremor', fxAmt(fxCfg.pending_level).toFixed(3));
    }

    // Diff снимков состояния: превращает «состояние изменилось» в события.
    function fxOnState(data) {
        if (!data || data.error) return;
        const prev = fxPrev;
        fxPrev = data;

        fxApplyHpNoise(data);

        // Первый снимок — только базовые уровни, без «событий»: иначе вход в
        // идущую партию сыграл бы смерть и выстрел разом.
        if (!prev) return;

        // Дрожание, пока дилер выбирает цель после физического выстрела.
        if (fxCfg.pending_enabled) fxSetTremor(!!data.pending_shot);
        else fxSetTremor(false);

        // Смерть игрока — приоритетнее выстрела: если оба совпали, играем срыв.
        const justDied = prev.my_alive && !data.my_alive;
        if (justDied) {
            if (fxCfg.death_enabled) { fxRollout(fxCfg.death_level); fxBurst(fxCfg.death_level, true); }
            return;
        }

        // Выстрел определяем по расходу патрона — так эффект срабатывает и
        // когда стреляли не в нас (по столу всё равно бьёт звук и вспышка).
        const shellsBefore = Number(prev.shells_remaining ?? 0);
        const shellsNow = Number(data.shells_remaining ?? 0);
        const hpDropped = Number(data.my_hp ?? 0) < Number(prev.my_hp ?? 0);
        const shellSpent = shellsNow === shellsBefore - 1 && prev.phase === 'player_turn';

        if (fxCfg.shot_enabled && (hpDropped || shellSpent)) {
            // Попадание по нам бьёт сильнее, чем чужой выстрел.
            const scale = hpDropped ? 1 : 0.55;
            fxBurst(Number(fxCfg.shot_level) * scale, hpDropped);
        }
    }

    function cctvSetConfig(cfg) {
        cctvCfg = Object.assign({}, cctvCfg, cfg);
        if (cfg.fake_error) cctvCfg.fake_error = Object.assign({}, cctvCfg.fake_error, cfg.fake_error);
        if (cfg.degrade) cctvCfg.degrade = Object.assign({}, cctvCfg.degrade, cfg.degrade);
        if (cfg.reactive) fxSetConfig(cfg.reactive);
        cctvInitFrames();
        cctvApplyDegrade();
        // Если дилер заблокировал камеру прямо во время показа — убираем её с
        // экрана сразу, а не после конца текущего показа.
        if (cctvShown) {
            const live = Object.keys(cctvPersistentFrames)
                .filter(cam => cctvPersistentFrames[cam].style.display !== 'none')
                .filter(cam => cctvVis(cam) !== 'blocked');
            if (!live.length) cctvHide();
            else cctvRender(live);
        }
        if (cctvShown && cctvCfg.fake_error && cctvCfg.fake_error.enabled) cctvStartFaults();
        else if (cctvShown) cctvStopFaults();
        cctvScheduleNext();
    }

    // Cameras run from boot — no game state required. The first config push
    // from the server just refines the timings already in effect.
    cctvPhaseOk = true;
    cctvInitFrames();

    connectTV();

    // ── Подсказки в паузах ──
    // Пока идёт ожидание (подключение, лобби, смена раунда, зарядка), внизу
    // экрана крутятся выдержки из «Соглашения». Меняются раз в TIP_PERIOD;
    // порядок — перемешанная очередь, так что повтор возможен только после
    // того, как показаны все остальные.
    const TIPS = [
        'Вследствие невыполнения ▓▓▓▓▓▓▓▓▓▓ Компания имеет право взыскать с вас ▓▓▓▓▓▓▓▓▓▓ в полном объёме и без предварительного уведомления.',
        'Напоминаем: выстрел в себя — это тоже ход.',
        'Статистика предыдущих Участников не разглашается и не комментируется.',
        'Дилер гарантирует честную игру, равные шансы и полное отсутствие гарантий по всем трём пунктам.',
        'Просьба воздержаться от вопросов «за что?». Данный вопрос отнесён Соглашением к Претензиям.',
        'Заведение напоминает: возврат не производится.',
        'Компания благодарит вас за спокойствие. Оно облегчает работу всем.',
        'Медицинская помощь оказывается по усмотрению Дилера.',
        'Пункт 5 прочитан вами полностью. Вы подтвердили это.',
        'В случае наступления исхода, не предусмотренного вашими планами на вечер, действие Соглашения не приостанавливается.',
    ];
    const TIP_PERIOD = 9000;   // сколько висит одна подсказка
    const TIP_FADE = 600;      // должно совпадать с transition у #tv-tip-inner

    const tipBox = document.getElementById('tv-tip');
    const tipInner = document.getElementById('tv-tip-inner');
    const tipText = document.getElementById('tv-tip-text');
    let tipQueue = [];
    let tipTimer = null;
    let tipFadeTimer = null;
    let tipShown = false;

    function tipNext() {
        if (!tipQueue.length) {
            // Перемешиваем заново. Если первый элемент новой очереди совпал с
            // только что показанным, сдвигаем его — чтобы на стыке очередей
            // одна и та же строка не висела два периода подряд.
            tipQueue = TIPS.slice();
            for (let i = tipQueue.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [tipQueue[i], tipQueue[j]] = [tipQueue[j], tipQueue[i]];
            }
            if (tipQueue.length > 1 && tipQueue[0] === tipText.textContent) {
                tipQueue.push(tipQueue.shift());
            }
        }
        return tipQueue.shift();
    }

    function tipCycle(first) {
        clearTimeout(tipFadeTimer);
        if (first) {
            tipText.textContent = tipNext();
            tipInner.classList.add('visible');
        } else {
            tipInner.classList.remove('visible');
            tipFadeTimer = setTimeout(() => {
                tipText.textContent = tipNext();
                tipInner.classList.add('visible');
            }, TIP_FADE);
        }
        tipTimer = setTimeout(() => tipCycle(false), TIP_PERIOD);
    }

    function tipShow() {
        if (tipShown) return;
        tipShown = true;
        tipBox.classList.add('active');
        tipCycle(true);
    }

    function tipHide() {
        if (!tipShown) return;
        tipShown = false;
        clearTimeout(tipTimer);
        clearTimeout(tipFadeTimer);
        tipBox.classList.remove('active');
        tipInner.classList.remove('visible');
    }

    // ── Player Game WebSocket ──
    const playerId = document.getElementById('player-app').dataset.playerId;
    let ws;
    let reconnectTimer;
    let showConnectingTimer;

    function connect() {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        ws = new WebSocket(`${proto}://${location.host}/ws/player/${playerId}`);

        ws.onopen = () => {
            clearTimeout(showConnectingTimer);
            document.getElementById('connecting').style.display = 'none';
            // Дальше подсказку включает/выключает updateUI по фазе.
            tipHide();
            clearTimeout(reconnectTimer);
            ws.pingInterval = setInterval(() => {
                if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ping: 1}));
            }, 10000);
        };

        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            updateUI(data);
        };

        ws.onclose = () => {
            clearInterval(ws.pingInterval);
            showConnectingTimer = setTimeout(() => {
                document.getElementById('connecting').style.display = 'flex';
                tipShow();
            }, 3000);
            reconnectTimer = setTimeout(connect, 2000);
        };
    }

    let gameOverTimeout = null;
    let roundOverTimeout = null;
    let showingRoundOverScreen = false;

    // Фазы, в которых на экране висит «ожидание» и есть место под подсказку.
    // round_over — отдельно: там сначала 5 c анимации индикаторов раунда,
    // подсказку включаем только когда экран уже показан.
    const TIP_PHASES = ['lobby', 'dealer_loading', 'dealer_reloading'];

    function updateUI(data) {
        // Держим последнее состояние: сетка мультиплеера перерисовывается ещё и
        // по команде дилера, вне игрового тика.
        if (!data.error) lastPlayerState = data;
        if (data.error) {
            const screens = ['state-game', 'state-dead', 'state-gameover', 'state-roundover', 'state-loading'];
            screens.forEach(s => document.getElementById(s).style.display = 'none');
            document.getElementById('state-lobby').style.display = 'flex';
            document.getElementById('lobby-status').textContent = 'СЕАНС ЗАВЕРШЁН (ИГРОК НЕ НАЙДЕН)';
            tipHide();
            return;
        }

        // Единственная точка, где подсказка включается/гасится по фазе.
        // round_over исключён: в этой фазе её включает таймер ниже, когда
        // экран смены раунда уже показан, а гасит — первая же следующая фаза.
        if (TIP_PHASES.includes(data.phase)) tipShow();
        else if (data.phase !== 'round_over') tipHide();

        // Реакция ЭЛТ на изменения состояния (выстрел, потеря HP, смерть).
        fxOnState(data);

        // Gate camera auto-cycle to in-game / round-waiting phases.
        if (typeof cctvSetPhase === 'function') cctvSetPhase(data.phase);

        const screens = ['state-lobby', 'state-game', 'state-dead', 'state-gameover', 'state-roundover', 'state-loading'];
        screens.forEach(s => document.getElementById(s).style.display = 'none');

        if (data.phase === 'lobby') {
            document.getElementById('state-lobby').style.display = 'flex';
            return;
        }

        if (data.phase === 'game_over') {
            document.getElementById('state-gameover').style.display = 'flex';
            if (data.winner_name) {
                document.getElementById('gameover-text').textContent = 'победитель';
                document.getElementById('gameover-winner').textContent = data.winner_name;
            } else {
                document.getElementById('gameover-text').textContent = 'конец игры';
                document.getElementById('gameover-winner').textContent = '';
            }
            return;
        } else {
            if (gameOverTimeout) {
                clearTimeout(gameOverTimeout);
                gameOverTimeout = null;
            }
        }

        if (data.phase !== 'round_over') {
            if (roundOverTimeout) {
                clearTimeout(roundOverTimeout);
                roundOverTimeout = null;
            }
            showingRoundOverScreen = false;
        }

        if (data.phase === 'round_over') {
            if (!roundOverTimeout && !showingRoundOverScreen) {
                roundOverTimeout = setTimeout(() => {
                    showingRoundOverScreen = true;
                    const screens = ['state-lobby', 'state-game', 'state-dead', 'state-gameover', 'state-roundover', 'state-loading'];
                    screens.forEach(s => document.getElementById(s).style.display = 'none');
                    document.getElementById('state-roundover').style.display = 'flex';
                    tipShow();

                    const container = document.getElementById('round-indicators');
                    const msg = document.getElementById('roundover-msg');
                    const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII"];
                    let html = '';
                    for (let i = 1; i <= data.total_rounds; i++) {
                        const isFinal = i === data.total_rounds;
                        let icon = isFinal ? '<img class="skull-icon-svg" src="/static/icons/skull.png" alt="">' : ROMAN[i - 1];
                        html += `
                            <div class="round-col">
                                <div class="round-icon">${icon}</div>
                                <div class="round-circle ${i === data.current_round ? 'active' : ''}" id="round-circle-${i}">
                                    <img class="inner-circle" src="/static/icons/round-dot.png" alt="">
                                </div>
                            </div>
                        `;
                    }
                    container.innerHTML = html;
                    msg.style.opacity = '0';
                    
                    setTimeout(() => {
                        const cur = document.getElementById(`round-circle-${data.current_round}`);
                        if (cur) cur.classList.remove('active');
                        
                        const next = document.getElementById(`round-circle-${data.current_round + 1}`);
                        if (next) next.classList.add('active');
                        
                        setTimeout(() => {
                            msg.style.opacity = '1';
                        }, 1000);
                    }, 1500);
                    
                }, 5000);
            }
            
            if (showingRoundOverScreen) {
                document.getElementById('state-roundover').style.display = 'flex';
                return;
            }
        }

        if (data.phase === 'dealer_loading') {
            document.getElementById('state-loading').style.display = 'flex';
            document.getElementById('player-loading-msg').innerHTML =
                `дилер заряжает дробовик<span class="cursor-blink">_</span>`;
            return;
        }

        if (data.phase === 'dealer_reloading') {
            document.getElementById('state-loading').style.display = 'flex';
            document.getElementById('player-loading-msg').innerHTML =
                `дилер дозаряжает<span class="cursor-blink">_</span>`;
            return;
        }

        // Dead
        if (data.game_mode === 'solo' || data.game_mode === 'story' || data.game_mode === 'story_one_round') {
            if (!data.my_alive || (data.opponent_alive !== undefined && !data.opponent_alive)) {
                if (data.phase !== 'game_over') return;
            }
        } else {
            if (!data.my_alive) {
                document.getElementById('state-dead').style.display = 'flex';
                return;
            }
        }

        // In game — show lightning bolts
        document.getElementById('state-game').style.display = 'flex';

        if (data.game_mode === 'solo' || data.game_mode === 'story' || data.game_mode === 'story_one_round') {
            document.getElementById('mp-layout').style.display = 'none';
            document.getElementById('solo-layout').style.display = 'flex';
            
            const dLabel = document.getElementById('solo-dealer-label');
            const dTurn = document.getElementById('solo-dealer-turn');
            if (data.opponent_handcuffed) {
                dLabel.style.color = 'var(--red)';
                dLabel.classList.remove('active');
                dTurn.textContent = '[ в наручниках ]';
                dTurn.style.color = 'var(--red)';
            } else if (data.is_opponent_turn) {
                dLabel.style.color = 'var(--red)';
                dLabel.classList.add('active');
                dTurn.textContent = '[ ход дилера ]';
                dTurn.style.color = 'var(--red)';
            } else {
                dLabel.style.color = 'var(--text-bright)';
                dLabel.classList.remove('active');
                dTurn.textContent = '';
            }
            
            const pLabel = document.getElementById('solo-player-label');
            const pTurn = document.getElementById('solo-player-turn');
            if (data.my_handcuffed) {
                pLabel.style.color = 'var(--red)';
                pLabel.classList.remove('active');
                pTurn.textContent = '[ в наручниках ]';
                pTurn.style.color = 'var(--red)';
            } else if (data.is_my_turn) {
                pLabel.style.color = 'var(--green-bright)';
                pLabel.classList.add('active');
                pTurn.textContent = '[ ваш ход ]';
                pTurn.style.color = 'var(--green-bright)';
            } else {
                pLabel.style.color = 'var(--text-bright)';
                pLabel.classList.remove('active');
                pTurn.textContent = '';
            }
            
            renderBolts(data.opponent_hp, data.opponent_max_hp, 'opponent-lightning-container', data.game_mode, data.current_round);
            renderBolts(data.my_hp, data.my_max_hp, 'solo-lightning-container', data.game_mode, data.current_round);
        } else {
            document.getElementById('mp-layout').style.display = 'block';
            document.getElementById('solo-layout').style.display = 'none';

            renderMpGrid(data);
        }
    }

    // ── Мультиплеер: сетка секций игроков ──
    // Сколько секций рисовать, решает дилер (POST /api/tv/mp_slots). 0 = авто:
    // ровно по числу игроков в партии. Ненулевое значение фиксирует сетку —
    // лишние секции стоят пустыми («СВОБОДНО»), пока игроки подключаются.
    const MP_SLOTS_MAX = 8;
    let mpSlotsOverride = 0;
    let lastPlayerState = null;

    function renderMpGrid(data) {
        const summary = Array.isArray(data.players_summary) ? data.players_summary : [];
        const count = Math.min(
            MP_SLOTS_MAX,
            Math.max(mpSlotsOverride > 0 ? mpSlotsOverride : summary.length, summary.length, 1)
        );

        const grid = document.getElementById('mp-grid');
        // Сетку подбираем той же функцией, что и экран камер: она ищет раскладку,
        // где ячейка ближе всего к 4:3, и штрафует рваный последний ряд. Так на
        // кинескопе 800×600 любое число секций влезает целиком, без прокрутки.
        const { cols, rows } = cctvGridFor(count);
        grid.style.setProperty('--mp-cols', cols);
        grid.style.setProperty('--mp-rows', rows);

        // Неполный последний ряд растягиваем на всю ширину — как в CCTV-гриде,
        // иначе справа остаётся чёрная дыра. Остаток делим между ячейками ряда,
        // лишние колонки достаются первым.
        const lastCount = count - cols * (rows - 1);
        const firstOfLast = count - lastCount;

        // Перестраиваем DOM только когда изменилось число секций: иначе каждый
        // тик состояния сбрасывал бы анимацию мигания активного игрока.
        if (grid.children.length !== count) {
            let html = '';
            for (let i = 0; i < count; i++) {
                let span = '';
                if (i >= firstOfLast && lastCount < cols) {
                    const idx = i - firstOfLast;
                    const base = Math.floor(cols / lastCount);
                    const extra = cols % lastCount;
                    span = ` style="grid-column: span ${base + (idx < extra ? 1 : 0)}"`;
                }
                html += `<div class="mp-slot" data-slot="${i}"${span}>
                    <div class="mp-slot-name"></div>
                    <div class="mp-slot-turn"></div>
                    <div class="mp-slot-bolts"></div>
                </div>`;
            }
            grid.innerHTML = html;
        }

        for (let i = 0; i < count; i++) {
            const slot = grid.children[i];
            const p = summary[i];
            const turnEl = slot.querySelector('.mp-slot-turn');
            const nameEl = slot.querySelector('.mp-slot-name');
            const boltsEl = slot.querySelector('.mp-slot-bolts');

            if (!p) {
                slot.classList.add('empty');
                slot.classList.remove('dead');
                turnEl.textContent = '';
                turnEl.style.color = 'transparent';
                nameEl.textContent = 'СВОБОДНО';
                nameEl.classList.remove('active');
                nameEl.style.color = '';
                boltsEl.innerHTML = '';
                continue;
            }

            slot.classList.remove('empty');
            slot.classList.toggle('dead', !p.alive);

            const isMe = p.number === data.my_number;
            nameEl.textContent = p.name;

            // Плашка узкая, поэтому статусы короткие: длинный текст в ячейке
            // 1/8 экрана всё равно ушёл бы в многоточие.
            if (!p.alive) {
                turnEl.textContent = 'УБИТ';
                turnEl.style.color = 'var(--red-bright)';
                nameEl.classList.remove('active');
                nameEl.style.color = '';
            } else if (p.handcuffed) {
                turnEl.textContent = 'НАРУЧНИКИ';
                turnEl.style.color = 'var(--red-bright)';
                nameEl.classList.remove('active');
                nameEl.style.color = 'var(--red-bright)';
            } else if (p.number === data.current_player_number) {
                turnEl.textContent = isMe ? '▸ ВАШ ХОД' : '▸ ХОД';
                turnEl.style.color = 'var(--green-bright)';
                nameEl.classList.add('active');
                nameEl.style.color = 'var(--green-bright)';
            } else {
                turnEl.textContent = '';
                turnEl.style.color = 'transparent';
                nameEl.classList.remove('active');
                nameEl.style.color = '';
            }

            renderBoltsInto(boltsEl, p.hp, p.max_hp, data.game_mode, data.current_round);
        }
    }

    // Дилер сменил число секций — перерисовываем немедленно на последнем
    // известном состоянии, не дожидаясь следующего тика по игровому WS.
    function mpSetSlots(slots) {
        const n = parseInt(slots, 10);
        mpSlotsOverride = (isNaN(n) || n < 0) ? 0 : Math.min(n, MP_SLOTS_MAX);
        const layout = document.getElementById('mp-layout');
        if (lastPlayerState && layout && layout.style.display !== 'none') {
            renderMpGrid(lastPlayerState);
        }
    }

    function renderBolts(hp, maxHp, containerId, gameMode, currentRound) {
        renderBoltsInto(document.getElementById(containerId), hp, maxHp, gameMode, currentRound);
    }

    function renderBoltsInto(container, hp, maxHp, gameMode, currentRound) {
        if (!container) return;
        const isCritical = hp === 1 && maxHp > 1;
        const isStoryStage3 = gameMode === 'story' && currentRound === 3;
        let html = '';
        for (let i = 0; i < maxHp; i++) {
            const alive = i < hp;
            let cls = alive ? (isCritical ? 'alive critical' : 'alive') : 'dead';
            if (isStoryStage3 && i < 2) {
                cls += alive ? ' faded-charge' : ' faded-charge-dead';
            }
            const src = (alive && isCritical) ? '/static/icons/bolt-critical.png' : '/static/icons/bolt-alive.png';
            html += `<div class="lightning-bolt ${cls}"><img src="${src}" alt=""></div>`;
        }
        container.innerHTML = html;
    }

    connect();
    </script>
</body>
</html>
