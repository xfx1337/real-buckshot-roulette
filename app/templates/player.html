<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Player #{{ player.number }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-player">
    <div class="crt-vignette" style="z-index:5;"></div>
    <div class="crt-scanlines" style="z-index:6; opacity:.4;"></div>
    <div id="player-app" data-player-id="{{ player.id }}">

        <!-- Connecting -->
        <div id="connecting" class="player-screen">
            <div class="player-lobby-msg">
                connecting<span class="cursor-blink">_</span>
            </div>
        </div>

        <!-- Lobby -->
        <div id="state-lobby" class="player-screen" style="display:none">
            <div class="player-lobby-msg">
                waiting for game<span class="cursor-blink">_</span>
            </div>
        </div>

        <!-- In Game -->
        <div id="state-game" class="player-screen" style="display:none">
            
            <!-- MULTIPLAYER MODE -->
            <div id="mp-layout" style="display:none; width:100%; height:100%; flex-direction:column; align-items:center;">
                <div class="turn-label" id="turn-label-mp">[Your Turn]</div>
                <div class="lightning-container" id="lightning-container-mp"></div>
            </div>

            <!-- SOLO MODE -->
            <div id="solo-layout" class="solo-layout" style="display:none">
                <div class="solo-t-horizontal"></div>
                <div class="solo-t-vertical"></div>
                
                <div class="solo-half left-half">
                    <div class="solo-turn-label" id="solo-dealer-turn"></div>
                    <div class="solo-label" id="solo-dealer-label">DEALER</div>
                    <div class="solo-bolts" id="opponent-lightning-container"></div>
                </div>
                
                <div class="solo-half right-half">
                    <div class="solo-turn-label" id="solo-player-turn"></div>
                    <div class="solo-label" id="solo-player-label">PLAYER</div>
                    <div class="solo-bolts" id="solo-lightning-container"></div>
                </div>
            </div>
        </div>

        <!-- Dead -->
        <div id="state-dead" class="dead-screen" style="display:none">
            <div class="dead-text">dead</div>
        </div>

        <!-- Game Over -->
        <div id="state-gameover" class="gameover-screen" style="display:none">
            <div class="gameover-text" id="gameover-text">game over</div>
            <div class="gameover-winner" id="gameover-winner"></div>
        </div>

        <!-- Round Over -->
        <div id="state-roundover" class="gameover-screen" style="display:none">
            <div class="round-transition-container">
                <div class="round-indicators" id="round-indicators">
                    <!-- injected by JS -->
                </div>
                <div class="player-lobby-msg" id="roundover-msg" style="margin-top: 30px; opacity: 0; transition: opacity 0.5s;">
                    waiting for dealer<span class="cursor-blink">_</span>
                </div>
            </div>
        </div>

        <!-- Dealer Loading -->
        <div id="state-loading" class="player-screen" style="display:none">
            <div class="shell-counts-display" id="player-shell-counts">
                <!-- will be injected -->
            </div>
        </div>
    </div>

    <div id="fullscreen-gate" class="fullscreen-gate">
        <div class="fullscreen-gate-inner">
            <div class="player-lobby-msg">tap to start<span class="cursor-blink">_</span></div>
        </div>
    </div>

    <!-- Видео-фолбэк для удержания экрана на http (см. keepAwake ниже). Скрытое,
         зациклённое, без звука; источник — крошечный data-URI, внешних файлов нет. -->
    <video id="nosleep-video" muted playsinline loop
           style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-10px;top:-10px;"></video>

    <script>
    // ── Fullscreen + удержание экрана (не даём телефону погасить дисплей) ──
    // Браузеры требуют жест пользователя для fullscreen / wake lock, поэтому
    // оверлей fullscreen-gate ловит первый тап по экрану.
    //
    // Два механизма, потому что основной работает не везде:
    //  1) Screen Wake Lock API — правильный путь, НО браузеры дают его только на
    //     HTTPS/localhost. Игра идёт по локальному http://<ip> → там он молча
    //     отклоняется, и экран гаснет по системному таймауту.
    //  2) Фолбэк: зацикленное скрытое видео (техника NoSleep.js). Пока играет
    //     видео, ОС не тушит экран — и это РАБОТАЕТ на http. Держим оба сразу:
    //     где доступен wake lock — он основной, видео его дублирует безвредно.
    let wakeLock = null;
    let wakeLockRefreshTimer = null;

    // Крошечный немой MP4 (несколько кадров), зашитый data-URI — без внешних
    // файлов и сетевых запросов. Достаточно, чтобы браузер считал экран «занят».
    const NOSLEEP_MP4 = "data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAMQbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAA+gAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAjp0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAA+gAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAEAAAABAAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAAPoAAAAAAABAAAAAAGybWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAABAAAAAQABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABXW1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAAR1zdGJsAAAAuXN0c2QAAAAAAAAAAQAAAKlhdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAAEAAQABIAAAASAAAAAAAAAABFUxhdmM2Mi4yOC4xMDEgbGlieDI2NAAAAAAAAAAAAAAAGP//AAAAL2F2Y0MBQsAe/+EAF2dCwB7ZBCbARAAAAwAEAAADAAg8WLkgAQAFaMuDyyAAAAAQcGFzcAAAAAEAAAABAAAAFGJ0cnQAAAAAAAAUkAAAAAAAAAAYc3R0cwAAAAAAAAABAAAAAQAAQAAAAAAcc3RzYwAAAAAAAAABAAAAAQAAAAEAAAABAAAAFHN0c3oAAAAAAAACkgAAAAEAAAAUc3RjbwAAAAAAAAABAAADQAAAAGJ1ZHRhAAAAWm1ldGEAAAAAAAAAIWhkbHIAAAAAAAAAAG1kaXJhcHBsAAAAAAAAAAAAAAAALWlsc3QAAAAlqXRvbwAAAB1kYXRhAAAAAQAAAABMYXZmNjIuMTIuMTAxAAAACGZyZWUAAAKabWRhdAAAAnAGBf//bNxF6b3m2Ui3lizYINkj7u94MjY0IC0gY29yZSAxNjUgcjMyMjIgYjM1NjA1YSAtIEguMjY0L01QRUctNCBBVkMgY29kZWMgLSBDb3B5bGVmdCAyMDAzLTIwMjUgLSBodHRwOi8vd3d3LnZpZGVvbGFuLm9yZy94MjY0Lmh0bWwgLSBvcHRpb25zOiBjYWJhYz0wIHJlZj0zIGRlYmxvY2s9MTowOjAgYW5hbHlzZT0weDE6MHgxMTEgbWU9aGV4IHN1Ym1lPTcgcHN5PTEgcHN5X3JkPTEuMDA6MC4wMCBtaXhlZF9yZWY9MSBtZV9yYW5nZT0xNiBjaHJvbWFfbWU9MSB0cmVsbGlzPTEgOHg4ZGN0PTAgY3FtPTAgZGVhZHpvbmU9MjEsMTEgZmFzdF9wc2tpcD0xIGNocm9tYV9xcF9vZmZzZXQ9LTIgdGhyZWFkcz0yIGxvb2thaGVhZF90aHJlYWRzPTEgc2xpY2VkX3RocmVhZHM9MCBucj0wIGRlY2ltYXRlPTEgaW50ZXJsYWNlZD0wIGJsdXJheV9jb21wYXQ9MCBjb25zdHJhaW5lZF9pbnRyYT0wIGJmcmFtZXM9MCB3ZWlnaHRwPTAga2V5aW50PTI1MCBrZXlpbnRfbWluPTEgc2NlbmVjdXQ9NDAgaW50cmFfcmVmcmVzaD0wIHJjX2xvb2thaGVhZD00MCByYz1jcmYgbWJ0cmVlPTEgY3JmPTIzLjAgcWNvbXA9MC42MCBxcG1pbj0wIHFwbWF4PTY5IHFwc3RlcD00IGlwX3JhdGlvPTEuNDAgYXE9MToxLjAwAIAAAAAaZYiEBX///w9FAAFC3ycnJ1111111111114A=";

    const nosleepVideo = document.getElementById('nosleep-video');
    function startNoSleepVideo() {
        try {
            if (!nosleepVideo.src) nosleepVideo.src = NOSLEEP_MP4;
            const p = nosleepVideo.play();
            if (p && p.catch) p.catch(() => {});
        } catch (e) { /* ignore */ }
    }

    async function requestWakeLock() {
        if (!('wakeLock' in navigator)) return;
        try {
            // Освобождаем старый wake lock, если есть
            if (wakeLock) {
                try {
                    await wakeLock.release();
                } catch (e) { /* ignore */ }
                wakeLock = null;
            }
            // Запрашиваем новый wake lock
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => { 
                wakeLock = null;
            });
        } catch (e) {
            // Отклонён (например, http без wake lock) — молчим, работает видео.
        }
    }

    function keepAwake() {
        requestWakeLock();      // основной путь (HTTPS/localhost)
        startNoSleepVideo();    // фолбэк, держит экран на http
        
        // Обновляем wake lock каждые 2 минуты (120000 мс), чтобы гарантировать
        // что экран останется включённым на протяжении всей игры
        if (wakeLockRefreshTimer) {
            clearInterval(wakeLockRefreshTimer);
        }
        wakeLockRefreshTimer = setInterval(() => {
            if (document.visibilityState === 'visible') {
                requestWakeLock();
                if (nosleepVideo.paused) startNoSleepVideo();
            }
        }, 120000); // 2 минуты
    }

    // Вернулись во вкладку — ОС могла отобрать оба механизма, поднимаем заново.
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            if (!wakeLock) requestWakeLock();
            if (nosleepVideo.paused) startNoSleepVideo();
        }
    });

    function enterImmersiveMode() {
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) {
            req.call(el).catch(() => {});
        }
        keepAwake();
        document.getElementById('fullscreen-gate').classList.add('hidden');
    }

    // Очищаем таймер при закрытии/перезагрузке страницы
    window.addEventListener('beforeunload', () => {
        if (wakeLockRefreshTimer) {
            clearInterval(wakeLockRefreshTimer);
        }
        if (wakeLock) {
            wakeLock.release().catch(() => {});
        }
    });

    document.getElementById('fullscreen-gate').addEventListener('click', enterImmersiveMode);
    document.getElementById('fullscreen-gate').addEventListener('touchend', (e) => {
        e.preventDefault();
        enterImmersiveMode();
    });
    </script>

    <script>
    const playerId = document.getElementById('player-app').dataset.playerId;
    let ws;
    let reconnectTimer;

    function connect() {
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        ws = new WebSocket(`${proto}://${location.host}/ws/player/${playerId}`);

        ws.onopen = () => {
            document.getElementById('connecting').style.display = 'none';
            clearTimeout(reconnectTimer);
        };

        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            updateUI(data);
        };

        ws.onclose = () => {
            document.getElementById('connecting').style.display = 'flex';
            reconnectTimer = setTimeout(connect, 2000);
        };
    }

    let gameOverTimeout = null;
    let roundOverTimeout = null;
    let showingRoundOverScreen = false;

    function updateUI(data) {
        if (data.error) {
            window.location.href = '/';
            return;
        }

        const screens = ['state-lobby', 'state-game', 'state-dead', 'state-gameover', 'state-roundover', 'state-loading'];
        screens.forEach(s => document.getElementById(s).style.display = 'none');

        if (data.phase === 'lobby') {
            document.getElementById('state-lobby').style.display = 'flex';
            return;
        }

        if (data.phase === 'game_over') {
            document.getElementById('state-gameover').style.display = 'flex';
            if (data.winner_name) {
                document.getElementById('gameover-text').textContent = 'winner';
                document.getElementById('gameover-winner').textContent = data.winner_name;
            } else {
                document.getElementById('gameover-text').textContent = 'game over';
                document.getElementById('gameover-winner').textContent = '';
            }
            if (!gameOverTimeout) {
                gameOverTimeout = setTimeout(() => {
                    window.location.href = '/';
                }, 8000); // 8 seconds delay before throwing them to main menu
            }
            return;
        } else {
            if (gameOverTimeout) {
                clearTimeout(gameOverTimeout);
                gameOverTimeout = null;
            }
        }

        if (data.phase !== 'round_over') {
            if (roundOverTimeout) {
                clearTimeout(roundOverTimeout);
                roundOverTimeout = null;
            }
            showingRoundOverScreen = false;
        }

        if (data.phase === 'round_over') {
            if (!roundOverTimeout && !showingRoundOverScreen) {
                roundOverTimeout = setTimeout(() => {
                    showingRoundOverScreen = true;
                    const screens = ['state-lobby', 'state-game', 'state-dead', 'state-gameover', 'state-roundover', 'state-loading'];
                    screens.forEach(s => document.getElementById(s).style.display = 'none');
                    document.getElementById('state-roundover').style.display = 'flex';
                    
                    const container = document.getElementById('round-indicators');
                    const msg = document.getElementById('roundover-msg');
                    const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII"];
                    let html = '';
                    for (let i = 1; i <= data.total_rounds; i++) {
                        const isFinal = i === data.total_rounds;
                        let icon = isFinal ? '<img class="skull-icon-svg" src="/static/icons/skull.png" alt="">' : ROMAN[i - 1];
                        html += `
                            <div class="round-col">
                                <div class="round-icon">${icon}</div>
                                <div class="round-circle ${i === data.current_round ? 'active' : ''}" id="round-circle-${i}">
                                    <img class="inner-circle" src="/static/icons/round-dot.png" alt="">
                                </div>
                            </div>
                        `;
                    }
                    container.innerHTML = html;
                    msg.style.opacity = '0';
                    
                    setTimeout(() => {
                        const cur = document.getElementById(`round-circle-${data.current_round}`);
                        if (cur) cur.classList.remove('active');
                        
                        const next = document.getElementById(`round-circle-${data.current_round + 1}`);
                        if (next) next.classList.add('active');
                        
                        setTimeout(() => {
                            msg.style.opacity = '1';
                        }, 1000);
                    }, 1500);
                    
                }, 5000);
            }
            
            if (showingRoundOverScreen) {
                document.getElementById('state-roundover').style.display = 'flex';
                return;
            }
            // If the 5 seconds haven't passed yet, fall through to render the actual HP/Dead state
        }

        if (data.phase === 'dealer_loading') {
            document.getElementById('state-loading').style.display = 'flex';
            document.getElementById('player-shell-counts').innerHTML = 
                `<span class="sc-live">${data.live_count} live</span> // <span class="sc-blank">${data.blank_count} blank</span>`;
            return;
        }

        if (data.phase === 'dealer_reloading') {
            document.getElementById('state-loading').style.display = 'flex';
            document.getElementById('player-shell-counts').innerHTML = 
                `<span style="color:var(--text-color); font-size:1.5rem">waiting for dealer...</span>`;
            return;
        }

        // Dead
        if (data.game_mode === 'solo' || data.game_mode === 'story') {
            // In solo mode, show game over screen if either dies (no dead screen)
            if (!data.my_alive || (data.opponent_alive !== undefined && !data.opponent_alive)) {
                // If it's not game_over phase yet, it will be soon. Just wait.
                if (data.phase !== 'game_over') return;
            }
        } else {
            if (!data.my_alive) {
                document.getElementById('state-dead').style.display = 'flex';
                return;
            }
        }

        // In game — show lightning bolts
        document.getElementById('state-game').style.display = 'flex';

        // Solo Mode adjustments
        if (data.game_mode === 'solo' || data.game_mode === 'story') {
            document.getElementById('mp-layout').style.display = 'none';
            document.getElementById('solo-layout').style.display = 'flex';
            
            // Opponent Turn label (DEALER)
            const dLabel = document.getElementById('solo-dealer-label');
            const dTurn = document.getElementById('solo-dealer-turn');
            if (data.opponent_handcuffed) {
                dLabel.style.color = 'var(--red)';
                dLabel.classList.remove('active');
                dTurn.textContent = '[ handcuffed ]';
                dTurn.style.color = 'var(--red)';
            } else if (data.is_opponent_turn) {
                dLabel.style.color = 'var(--red)';
                dLabel.classList.add('active');
                dTurn.textContent = '[ dealer turn ]';
                dTurn.style.color = 'var(--red)';
            } else {
                dLabel.style.color = 'var(--text-bright)';
                dLabel.classList.remove('active');
                dTurn.textContent = '';
            }
            
            // Player Turn label (PLAYER)
            const pLabel = document.getElementById('solo-player-label');
            const pTurn = document.getElementById('solo-player-turn');
            if (data.my_handcuffed) {
                pLabel.style.color = 'var(--red)';
                pLabel.classList.remove('active');
                pTurn.textContent = '[ handcuffed ]';
                pTurn.style.color = 'var(--red)';
            } else if (data.is_my_turn) {
                pLabel.style.color = 'var(--green-bright)';
                pLabel.classList.add('active');
                pTurn.textContent = '[ player turn ]';
                pTurn.style.color = 'var(--green-bright)';
            } else {
                pLabel.style.color = 'var(--text-bright)';
                pLabel.classList.remove('active');
                pTurn.textContent = '';
            }
            
            // Bolts
            renderBolts(data.opponent_hp, data.opponent_max_hp, 'opponent-lightning-container', data.game_mode, data.current_round);
            renderBolts(data.my_hp, data.my_max_hp, 'solo-lightning-container', data.game_mode, data.current_round);
        } else {
            document.getElementById('mp-layout').style.display = 'flex';
            document.getElementById('solo-layout').style.display = 'none';

            // Player Turn label
            const turnLabel = document.getElementById('turn-label-mp');
            if (data.my_handcuffed) {
                turnLabel.textContent = '[ handcuffed ]';
                turnLabel.style.color = 'var(--red)';
                turnLabel.classList.add('active');
                turnLabel.style.animation = 'none';
            } else if (data.is_my_turn) {
                turnLabel.textContent = '[ this player turn ]';
                turnLabel.style.color = 'var(--green-bright)';
                turnLabel.classList.add('active');
                turnLabel.style.animation = ''; // Restore blink
            } else {
                turnLabel.classList.remove('active');
            }

            renderBolts(data.my_hp, data.my_max_hp, 'lightning-container-mp', data.game_mode, data.current_round);
        }
    }

    function renderBolts(hp, maxHp, containerId, gameMode, currentRound) {
        const container = document.getElementById(containerId);
        const isCritical = hp === 1 && maxHp > 1;
        // Стори мод, стадия 3: первые 2 заряда «с перерезанными кабелями» —
        // не восстанавливаются лечением, показываем их приглушёнными
        const isStoryStage3 = gameMode === 'story' && currentRound === 3;
        let html = '';
        for (let i = 0; i < maxHp; i++) {
            const alive = i < hp;
            let cls = alive ? (isCritical ? 'alive critical' : 'alive') : 'dead';
            if (isStoryStage3 && i < 2) {
                cls += alive ? ' faded-charge' : ' faded-charge-dead';
            }
            const src = (alive && isCritical) ? '/static/icons/bolt-critical.png' : '/static/icons/bolt-alive.png';
            html += `<div class="lightning-bolt ${cls}"><img src="${src}" alt=""></div>`;
        }
        container.innerHTML = html;
    }

    connect();
    </script>
</body>
</html>
