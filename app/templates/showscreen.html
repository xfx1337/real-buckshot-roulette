<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Showscreen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .showscreen-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .hidden { display: none !important; }
        .tap-btn {
            background: none;
            border: 2px solid var(--green);
            color: var(--green);
            font-family: 'Share Tech Mono', monospace;
            font-size: 24px;
            padding: 20px 40px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px var(--green-glow);
            transition: all 0.3s ease;
        }
        .tap-btn:active {
            background: var(--green);
            color: var(--bg-color);
        }
        .msg-display {
            font-size: 32px;
            color: var(--green-bright);
            margin-top: 20px;
            text-shadow: 0 0 10px var(--green-glow);
        }
        .player-name {
            font-size: 20px;
            color: var(--text-color);
            margin-bottom: 30px;
        }
        .idle-text {
            color: var(--text-color);
            opacity: 0.5;
            font-size: 18px;
        }
        /* Телефонные карточки. Номер читают через комнату и набирают на диске,
           поэтому он крупнее всего остального на экране, а цифры разрежены —
           слитные легко перепутать при наборе. */
        .phone-line {
            font-size: 28px;
            color: var(--text-color);
            letter-spacing: 2px;
            margin-bottom: 24px;
        }
        .phone-number {
            font-size: 140px;
            line-height: 1;
            letter-spacing: 18px;
            color: var(--green-bright);
            text-shadow: 0 0 24px var(--green-glow);
        }
        .phone-timer {
            margin-top: 28px;
            font-size: 20px;
            color: var(--text-color);
            opacity: 0.65;
        }
        /* Входящий: мигает, потому что аппарат звонит и экран должен
           говорить то же самое, что и звонки. */
        .phone-ringing { animation: phone-blink 1s steps(2, start) infinite; }
        @keyframes phone-blink { to { opacity: 0.25; } }
    </style>
</head>
<body class="page-player">
    <div class="crt-vignette" style="z-index:5;"></div>
    <div class="crt-scanlines" style="z-index:6; opacity:.4;"></div>
    
    <div class="showscreen-container" id="container">
        <div id="idle-view">
            <div class="idle-text">waiting for messages<span class="cursor-blink">_</span></div>
        </div>
        
        <div id="prompt-view" class="hidden">
            <div class="player-name" id="prompt-player-name"></div>
            <button class="tap-btn" id="reveal-btn">Tap to read</button>
        </div>
        
        <div id="result-view" class="hidden">
            <div class="player-name" id="result-player-name"></div>
            <div class="msg-display" id="result-msg"></div>
        </div>

        <!-- Телефонные карточки: показывается сразу, без нажатия. -->
        <div id="phone-view" class="hidden">
            <div class="player-name" id="phone-player-name"></div>
            <div class="phone-line" id="phone-line"></div>
            <div class="phone-number" id="phone-number"></div>
            <div class="phone-timer" id="phone-timer"></div>
        </div>
    </div>

    <script>
        let ws;
        let reconnectTimer;

        // Prevent screen dimming if possible (wake lock)
        let wakeLock = null;
        async function requestWakeLock() {
            if (!('wakeLock' in navigator)) return;
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => { wakeLock = null; });
            } catch (e) {}
        }
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && !wakeLock) {
                requestWakeLock();
            }
        });
        document.body.addEventListener('click', requestWakeLock, {once: true});

        function connect() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${proto}://${location.host}/ws/showscreen`);

            ws.onopen = () => {
                clearTimeout(reconnectTimer);
                showIdle();
            };

            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (!data.message) return;
                // instant — сообщение телефонной карточки. Скрывать его не от
                // кого: игрок всё равно пойдёт набирать номер на глазах у
                // стола, а лишнее нажатие съедает время, которое этому номеру
                // отведено.
                if (data.instant) {
                    showPhone(data.player_name, data.message, data.item, data.seconds || 0);
                } else {
                    showPrompt(data.player_name, data.message);
                }
            };

            ws.onclose = () => {
                document.getElementById('idle-view').innerHTML = '<div class="idle-text">reconnecting<span class="cursor-blink">_</span></div>';
                showIdle();
                reconnectTimer = setTimeout(connect, 2000);
            };
        }

        function showIdle() {
            stopPhoneTimer();
            document.getElementById('idle-view').classList.remove('hidden');
            document.getElementById('prompt-view').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('phone-view').classList.add('hidden');
        }

        // ── телефонные карточки ──────────────────────────────────────────
        let phoneTimer = null;

        function stopPhoneTimer() {
            if (phoneTimer) { clearInterval(phoneTimer); phoneTimer = null; }
        }

        function showPhone(playerName, msg, item, seconds) {
            stopPhoneTimer();
            document.getElementById('idle-view').classList.add('hidden');
            document.getElementById('prompt-view').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('phone-view').classList.remove('hidden');

            document.getElementById('phone-player-name').textContent = `For: ${playerName}`;

            // Номер отделяется от текста, чтобы его можно было напечатать
            // крупно: строка приходит как «НАБЕРИ НОМЕР 427», и цифры в конце
            // — это то, что игрок будет крутить на диске.
            const digits = (msg.match(/(\d{3,})\s*$/) || [])[1] || '';
            const line = digits ? msg.slice(0, msg.length - digits.length).trim() : msg;

            document.getElementById('phone-line').textContent = line;
            const numberEl = document.getElementById('phone-number');
            numberEl.textContent = digits;
            // Входящий вызов номера не имеет: мигает сама строка, заодно с
            // звонками аппарата.
            document.getElementById('phone-line').classList.toggle(
                'phone-ringing', item === 'magnifying_glass');

            if (navigator.vibrate) navigator.vibrate(200);

            const timerEl = document.getElementById('phone-timer');
            if (!seconds) { timerEl.textContent = ''; return; }

            let left = seconds;
            const tick = () => {
                timerEl.textContent = left > 0 ? `${left} с` : '';
                if (left <= 0) { stopPhoneTimer(); showIdle(); return; }
                left -= 1;
            };
            tick();
            phoneTimer = setInterval(tick, 1000);
        }

        let currentMessage = '';
        let currentPlayer = '';

        function showPrompt(playerName, msg) {
            currentPlayer = playerName;
            currentMessage = msg;
            
            document.getElementById('idle-view').classList.add('hidden');
            document.getElementById('prompt-view').classList.remove('hidden');
            document.getElementById('result-view').classList.add('hidden');
            
            document.getElementById('prompt-player-name').textContent = `For: ${playerName}`;
            
            // vibrate if possible to notify the player
            if (navigator.vibrate) {
                navigator.vibrate(200);
            }
        }

        document.getElementById('reveal-btn').addEventListener('click', () => {
            document.getElementById('prompt-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            
            document.getElementById('result-player-name').textContent = `For: ${currentPlayer}`;
            document.getElementById('result-msg').innerHTML = currentMessage.replace(/\n/g, '<br>');
        });
        
        // Hide on tap anywhere in result view
        document.getElementById('result-view').addEventListener('click', () => {
            showIdle();
        });

        connect();
    </script>
</body>
</html>
