<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Buckshot Roulette</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-join">
    <div class="container center-content">
        <div class="logo-block small">
            <h1>ВХОД ИГРОКА</h1>
        </div>
        <div class="card">
            {% if error %}
            <div class="alert-error">{{ error }}</div>
            {% endif %}
            <form method="POST" action="/api/join" class="join-form">
                <label for="name">ИМЯ:</label>
                <input type="text" id="name" name="name" placeholder="..." required maxlength="20" autocomplete="off">
                <button type="submit" class="btn btn-player">ВОЙТИ</button>
            </form>
            <a href="/" class="btn btn-back">&lt; НАЗАД</a>
        </div>
    </div>
</body>
</html>
