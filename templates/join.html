<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>join — buckshot roulette</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-join crt-bg">
    <div class="crt-ambient-smoke"><span></span><span></span></div>
    <div class="crt-vignette"></div>
    <div class="crt-grain"></div>
    <div class="crt-scanlines"></div>

    <div class="container center-content">
        <div class="logo-block small">
            <h1>ПОДКЛЮЧЕНИЕ</h1>
        </div>
        <div class="card" style="max-width:420px; width:100%;">
            {% if error %}
            <div class="alert-error">{{ error }}</div>
            {% endif %}
            <form method="POST" action="/api/join" class="join-form">
                <label for="name">имя:</label>
                <input type="text" id="name" name="name" placeholder="ВВЕДИТЕ ИМЯ..." required maxlength="20" autocomplete="off">
                <button type="submit" class="btn btn-player">▸ СПУСТИТЬ КУРОК</button>
            </form>
            <a href="/" class="btn btn-back">&lt; назад</a>
        </div>
    </div>
</body>
</html>
