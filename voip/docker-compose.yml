services:
  asterisk:
    build: .
    container_name: backshot-pbx
    restart: unless-stopped
    # Ports are bound to the en6 address only. Docker would otherwise publish
    # them on every host interface, exposing the PBX to the home LAN on en0.
    ports:
      - "192.168.100.2:5060:5060/udp"
      - "192.168.100.2:10000-10050:10000-10050/udp"
      # AMI, for scripts/phone_digits.py. Loopback only.
      - "127.0.0.1:5038:5038/tcp"
    volumes:
      - ./etc/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./etc/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./etc/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./etc/modules.conf:/etc/asterisk/modules.conf:ro
      - ./etc/manager.conf:/etc/asterisk/manager.conf:ro
