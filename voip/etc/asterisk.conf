;
; Paths point at this project directory, so the PBX keeps its logs, spool and
; control socket here rather than in the Homebrew tree. Only the modules and
; the stock sound files are taken from the installed package.
;
[directories]
astetcdir => /Users/boomchick93/Desktop/voip/etc
astmoddir => /opt/homebrew/lib/asterisk/modules
astvarlibdir => /opt/homebrew/var/lib/asterisk
astdbdir => /Users/boomchick93/Desktop/voip/var
astkeydir => /Users/boomchick93/Desktop/voip/var
astdatadir => /opt/homebrew/var/lib/asterisk
astagidir => /Users/boomchick93/Desktop/voip/scripts
astspooldir => /Users/boomchick93/Desktop/voip/var/spool
astrundir => /Users/boomchick93/Desktop/voip/var/run
astlogdir => /Users/boomchick93/Desktop/voip/var/log
astsbindir => /opt/homebrew/sbin

[options]
documentation_language = en_US
; The default 1024 is more than this setup needs, and asking for more than the
; shell's limit makes Asterisk complain about file descriptors at every start.
maxcalls = 20
