; Paths for the locally built Asterisk under voip/asterisk-local.
;
; Written by scripts/run-asterisk.sh, which substitutes the absolute prefix
; before Asterisk reads this file — do not edit the copy in asterisk-local/etc.

[directories]
astetcdir => @PREFIX@/etc/asterisk
astmoddir => @PREFIX@/lib/asterisk/modules
astvarlibdir => @PREFIX@/var/lib/asterisk
astdbdir => @PREFIX@/var/lib/asterisk
astkeydir => @PREFIX@/var/lib/asterisk
astdatadir => @PREFIX@/var/lib/asterisk
astagidir => @PREFIX@/var/lib/asterisk/agi-bin
astspooldir => @PREFIX@/var/spool/asterisk
astrundir => @PREFIX@/var/run/asterisk
astlogdir => @PREFIX@/var/log/asterisk
astsbindir => @PREFIX@/sbin

[options]
; Runs as the logged-in user, not root: nothing here needs privileged ports
; (SIP is 5060, RTP is 10000+) or system directories.
verbose = 3
documentation_language = en_US
