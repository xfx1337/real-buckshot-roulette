[general]
static=yes
writeprotect=no

[globals]
; Longest a played-file call may last, in seconds. Every branch that answers
; sets this, because the gateway cannot be relied on to end the call itself:
; without a cap, a handset put back down leaves the channel Up and the FXS
; port held.
MAXCALL=300

; What extension 500 plays. A name from scripts/sounds.py — the converted
; file's name, without a path or an extension. Cyrillic filenames are
; transliterated when converted, so "зоопарк.mp3" is published as "zoopark".
; List what is available with:  python3 scripts/sounds.py
PLAYFILE=zoopark

;
; ── Calls arriving from the gateway (someone lifted a handset and dialled) ──
;
[from-gateway]

; 101-108 map to FXS ports 0/0-0/3 then 1/0-1/3, so handsets can ring each
; other without going near the PBX's own features.
exten => _10[1-8],1,NoOp(handset ${CALLERID(num)} dialling ${EXTEN})
 same => n,Set(TIMEOUT(absolute)=${MAXCALL})
 same => n,Dial(PJSIP/${EXTEN}@addpac,30)
 same => n,Hangup()

; 500 — plays the operator's own file into the handset. Dialled from a
; handset rather than originated, so it also proves the path in the
; direction the PBX does not control: the gateway seizing a port, sending
; the digits, and Asterisk answering.
;
; The file is whatever scripts/sounds.py published under this name. Change
; PLAYFILE to play something else, then reload the dialplan — no restart:
;   ./scripts/pbx.sh x "dialplan reload"
exten => 500,1,NoOp(audio check for ${CALLERID(num)})
 ; Long enough for the whole file; the cap has to outlast it or Playback is
 ; cut off mid-way. zoopark is just over three minutes.
 same => n,Set(TIMEOUT(absolute)=${MAXCALL})
 same => n,Answer()
 ; The FXS port needs a moment after answering before it passes audio;
 ; playing immediately clips the first word.
 same => n,Wait(1)
 same => n,Playback(${PLAYFILE})
 same => n,Wait(1)
 same => n,Hangup()

; 502 — the stock greeting, kept as a control. If 500 is silent but this is
; not, the fault is in the converted file rather than in the audio path.
exten => 502,1,NoOp(stock audio check for ${CALLERID(num)})
 same => n,Set(TIMEOUT(absolute)=60)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Wait(1)
 same => n,Hangup()

; 51x and 52x — programmable numbers. Each plays whichever sound the operator
; assigned to it in the web interface.
;
; The pattern is deliberately wider than the numbers that exist: which of
; them are real is decided by the Asterisk database, not by this file. A
; number the operator adds in the interface starts working on the next call,
; and one removed there stops — with no reload and no editing of this file,
; which is the whole point of keeping the assignment in the database.
;
; 500-509 are excluded because 500, 501 and 502 are the fixed test numbers
; above, and a pattern that swallowed them would shadow their entries.
;
; Set from the CLI as well, if wanted:
;
;   database put playslot 510 zoopark
;   database del playslot 510
;
; A number with nothing assigned says so rather than failing silently: an
; unset variable would make Playback() error and the caller would hear the
; line go dead with no explanation.
exten => _5[1-2][0-9],1,NoOp(slot ${EXTEN} for ${CALLERID(num)})
 same => n,Set(SLOT=${DB(playslot/${EXTEN})})
 same => n,Set(TIMEOUT(absolute)=${MAXCALL})
 same => n,Answer()
 ; The FXS port needs a moment after answering before it passes audio.
 same => n,Wait(1)
 same => n,GotoIf($["${SLOT}" = ""]?empty)
 same => n,Playback(${SLOT})
 same => n,Wait(1)
 same => n,Hangup()
 same => n(empty),Playback(invalid)
 same => n,Hangup()

; 501 — echo test. Proves audio flows in both directions.
exten => 501,1,NoOp(echo test for ${CALLERID(num)})
 same => n,Set(TIMEOUT(absolute)=120)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; Anything else gets told, rather than dropped in silence — a silent drop
; looks identical to a dead line from the handset's end.
exten => _X.,1,NoOp(unknown destination ${EXTEN})
 same => n,Set(TIMEOUT(absolute)=30)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(invalid)
 same => n,Hangup()

;
; ── What a handset hears once it answers a call the PBX placed ──
;
; scripts/call.py originates into this context with SOUNDFILE set to the file
; the operator picked. Kept separate from [from-gateway] so how long the phone
; rings is decided by originate's own timeout, not by anything here.
;
[play-file]

; The single entry point. SOUNDFILE is a sound name without extension, already
; resolved and validated by the caller.
exten => play,1,NoOp(playing ${SOUNDFILE} to ${CALLERID(num)})
 ; Set before Answer(): once Playback() starts, the file runs to its end
 ; whatever happens at the far side, so the cap has to already be armed.
 same => n,Set(TIMEOUT(absolute)=${MAXCALL})
 same => n,Answer()
 ; The FXS port needs a moment after answering before it passes audio.
 ; Playing immediately clips the first word.
 same => n,Wait(1)
 same => n,Playback(${SOUNDFILE})
 ; Let the tail of the file drain out of the jitter buffer before tearing the
 ; channel down, otherwise the last fraction of a second is cut off.
 same => n,Wait(1)
 ; Explicit, so the channel ends here rather than falling off the end of the
 ; dialplan and lingering while the gateway is asked to notice.
 same => n,Hangup()

; Same thing, but repeating until the caller hangs up. Used when the file is
; shorter than the call is meant to last.
exten => loop,1,NoOp(looping ${SOUNDFILE} to ${CALLERID(num)})
 same => n,Set(TIMEOUT(absolute)=${MAXCALL})
 same => n,Answer()
 same => n,Wait(1)
 same => n(again),Playback(${SOUNDFILE})
 same => n,Goto(again)

; Reached when the far end never answered, or the channel died. Only useful
; for the log line: the channel is already going away.
exten => failed,1,NoOp(originate failed: ${REASON})
 same => n,Hangup()

exten => h,1,NoOp(call to ${CALLERID(num)} ended, cause ${HANGUPCAUSE})
