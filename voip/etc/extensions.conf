[general]
static=yes
writeprotect=no

[globals]

; Calls arriving from the AddPac gateway — i.e. someone dialled on a handset.
[from-gateway]

; 101-108 reach the FXS port carrying that number, so handsets can ring
; each other.
exten => _10[1-8],1,NoOp(handset call to FXS port ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@addpac,30)
 same => n,Hangup()

; 600 — plays the game's lobby music, added by scripts/add-sound.sh.
exten => 600,1,NoOp(lobby music to ${CALLERID(num)})
 same => n,Answer()
 same => n,Playback(ambient_lobby)
 same => n,Hangup()

; 601 — echo test. Confirms two-way audio: whatever is spoken comes back.
exten => 601,1,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Hangup()

; 500 — one-way audio test. Confirms the PBX can play into the handset.
exten => 500,1,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Wait(1)
 same => n,Hangup()

; 700 — digit collector. Answers, then holds the line open so every key
; pressed afterwards arrives as an AMI DTMFEnd event, which
; scripts/phone_digits.py reads. Point a port's PLAR here and the handset
; becomes a keypad: lifting it opens the channel, no number to dial first.
exten => 700,1,NoOp(digit collector)
 same => n,Answer()
 ; A short dial tone confirms the line came up, then silence to dial into.
 ; Without it a lifted handset is indistinguishable from a dead one.
 same => n,Playtones(dial)
 same => n,Wait(2)
 same => n,StopPlaytones()
 same => n,Wait(3600)
 same => n,Hangup()

; Anything else: say so rather than dropping the call silently.
exten => _X.,1,NoOp(unknown destination ${EXTEN})
 same => n,Answer()
 same => n,Playback(invalid)
 same => n,Hangup()

; Calls originated by the game server via AMI/ARI land here.
[outbound]
exten => _10[1-8],1,NoOp(server-originated call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@addpac,30)
 same => n,Hangup()

; What a handset hears once it answers a call the PBX placed. Kept apart from
; [from-gateway] so the ring itself can run long: originate's own timeout is
; what limits how many seconds the phone rings, and it defaults to 30.
[to-handset]
exten => lobby,1,NoOp(lobby music to ${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 ; The track is 43 seconds, shorter than someone might stay on the line, so
 ; it repeats until they hang up.
 same => n(again),Playback(ambient_lobby)
 same => n,Goto(again)
