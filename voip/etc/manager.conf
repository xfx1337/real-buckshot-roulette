; AMI — the event stream scripts/phone_digits.py reads, and the channel
; control the web panel at /voip uses.
;
; Bound to loopback, so it is reachable from this Mac and from nowhere else.

[general]
enabled = yes
port = 5038
bindaddr = 127.0.0.1

[digits]
secret = backshot-ami
read = all
; "originate" is its own write class and is not covered by "call": without it
; Asterisk answers the panel's ring-a-handset action with "Permission denied".
write = system,call,originate,reporting
