[general]
enabled = yes
port = 5038
; Loopback only: the account below has originate rights, and nothing outside
; this machine needs them.
bindaddr = 127.0.0.1

[caller]
secret = voip-local
; "dtmf" is what carries DTMFBegin/DTMFEnd. Without it the connection still
; reports calls starting and ending, but every keypress is silently absent —
; the events are filtered per class before they reach the socket.
read = system,call,verbose,reporting,dtmf
write = system,call,originate,reporting
