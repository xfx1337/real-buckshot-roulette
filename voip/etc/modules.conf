[modules]
autoload=yes

; chan_sip is not built at all in this Asterisk 20 tree, so there is nothing
; competing with res_pjsip for UDP 5060 and no noload line is needed.

; The gateway sends a REGISTER for each of its eight numbers every 20 seconds,
; using provider credentials no account here matches. Nothing needs those
; registrations — the trunk is reached by static IP in both directions — but
; each one logged a warning, hundreds an hour. Declining to load the registrar
; makes Asterisk answer them with a plain 405 and say nothing.
noload => res_pjsip_registrar.so
