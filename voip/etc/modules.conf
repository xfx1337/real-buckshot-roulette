[modules]
autoload=yes

; The gateway never registers, and neither does anything else here. Loading
; the registrar only opens a path for unsolicited REGISTERs to create contacts
; that then compete with the static one in pjsip.conf.
noload => res_pjsip_registrar.so

; Not used, and each one logs an error at every start because its backend is
; absent on this machine.
noload => cdr_pgsql.so
noload => cdr_sqlite3_custom.so
noload => cdr_custom.so
noload => cel_custom.so
noload => cel_sqlite3_custom.so
noload => pbx_dundi.so
noload => res_hep.so
noload => res_hep_pjsip.so
noload => res_hep_rtcp.so
