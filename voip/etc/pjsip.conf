; PBX side of the link to the AddPac AP1100F gateway (8x FXS).
;
; The gateway sits on the direct ethernet segment 192.168.100.0/24:
;   192.168.100.2  this Mac (en6), running Asterisk natively
;   192.168.100.3  AddPac AP1100F
;
; Asterisk runs on the host, not in Docker, so packets from the gateway arrive
; with their real source address and the transport binds straight to the en6
; interface. That makes identification by IP work and removes the need for the
; unauthenticated catch-all endpoint the Docker setup required.

[transport-udp]
type=transport
protocol=udp
; Bound to the en6 address only, so the PBX is not reachable from the home LAN
; on en0.
bind=192.168.100.2:5060

; ---------------------------------------------------------------------------
; The gateway, as a static IP trunk. It never registers with us: calls run
; over the address below in both directions.
; ---------------------------------------------------------------------------

[addpac]
type=endpoint
context=from-gateway
disallow=all
allow=alaw
allow=ulaw
aors=addpac
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; The gateway signals keypresses out-of-band as RFC 2833 telephone-event.
; "auto" falls back to inband detection if it ever sends them as audio, which
; matters for the pulse-to-DTMF converter on the rotary handset.
dtmf_mode=auto

[addpac]
type=aor
contact=sip:192.168.100.3:5060
qualify_frequency=30

; Incoming requests are matched to the endpoint by source address.
[addpac]
type=identify
endpoint=addpac
match=192.168.100.3
