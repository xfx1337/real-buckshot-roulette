;
; SIP side of the link to the AddPac VoiceFinder AP1100F.
;
;   192.168.100.2   this Mac (en8), Asterisk
;   192.168.100.3   AP1100F, firmware 8.30U (2008)
;
; The gateway never registers with us and has no accounts. It is recognised by
; its source address and dialled at a fixed contact, so both directions work
; without any registration at all.
;

[transport-udp]
type=transport
protocol=udp
; Bound to the gateway-facing address only. Binding 0.0.0.0 would also expose
; the PBX on the home Wi-Fi interface, and would make the source address of
; outgoing INVITEs depend on routing rather than on this line.
bind=192.168.100.2:5060

[addpac]
type=endpoint
; An endpoint with no transport has nothing to send through: the INVITE fails
; as PJSIP_EUNSUPTRANSPORT before a packet leaves the host. Naming it here
; also makes the failure obvious if the transport ever fails to bind.
transport=transport-udp
context=from-gateway
disallow=all
; The AP1100F is a G.711 device. alaw first because that is what it offers.
allow=alaw
allow=ulaw
aors=addpac
; Audio must run through Asterisk: it is the thing playing the file, and there
; is no second endpoint for the gateway to talk to directly.
direct_media=no
rtp_symmetric=yes
force_rport=yes
; This gateway's Contact header is already the address we dial. Rewriting it
; from the packet source gains nothing and loses the port on a NAT-less link.
rewrite_contact=no
; Keypresses arrive as RFC 2833 telephone-event.
dtmf_mode=rfc4733
; No caller id of its own means Asterisk sends "Anonymous"
; <sip:anonymous@anonymous.invalid>, which this firmware rejects outright.
callerid=PBX <100>
trust_id_outbound=yes
;
; ── Why the call has to end on Asterisk's terms ──
;
; The gateway does not reliably report a handset going back on-hook. A call it
; has forgotten about stays Up here, keeps streaming, and holds the FXS port —
; which is exactly the "busy / disconnecting" state that blocks the next call.
; So Asterisk must decide by itself, from the only evidence available: whether
; audio is still arriving.
;
; 45s is chosen against the two failure modes. Lower, and an ordinary gap in
; this gateway's stream kills a working call. Higher, and an abandoned line
; keeps its port for longer than anyone waits before redialling.
rtp_timeout=45
rtp_timeout_hold=45
;
; Session timers stay off. The firmware answers a short interval with
; "422 Session Interval Too Small", and by the time the renegotiation is done
; it considers the port busy and drops the call as "486 Busy Here".
; rtp_timeout above already ends dead calls without asking the gateway
; for anything it cannot do.
timers=no
; Nothing here transfers calls, and the gateway handles REFER badly.
allow_transfer=no
; 183 with early media confuses this firmware's ring generator; let it ring
; normally and start audio only after it answers.
inband_progress=no
; Reliable provisional responses. Offering 100rel makes Asterisk advertise it
; in Supported:, and this firmware answers such an INVITE with 180 Ringing
; immediately followed by 503 Service Unavailable — it starts the ring, then
; abandons the call in the same second.
100rel=no
; Left at the default (en). "ru" is not a country code Asterisk ships
; indications for, and setting it only produces
;   ERROR chan_pjsip.c: Unknown country code 'ru' for tonezone
; on every call while changing no tone the handset actually hears, because
; the ring itself is generated by the gateway.

[addpac]
type=aor
contact=sip:192.168.100.3:5060
;
; Qualify is off, and this is load-bearing rather than a tidiness choice.
; The AP1100F does not answer OPTIONS, so probing it only ever marks the one
; contact we have as Unavail — and Asterisk refuses to build a dialog to an
; Unavail contact:
;
;   ERROR res_pjsip.c: Endpoint 'addpac': Could not create dialog to
;   invalid URI 'addpac'.  Is endpoint registered and reachable?
;
; With the probe off the contact stays usable and INVITEs go straight to the
; address above. Reachability is checked with ping and with a real call
; instead; see scripts/health.sh.
qualify_frequency=0
max_contacts=1
remove_existing=yes

; Requests from the gateway carry no credentials, so they are matched to the
; endpoint by source address.
[addpac]
type=identify
endpoint=addpac
match=192.168.100.3
